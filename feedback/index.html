<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — Loops</title>
  <style>
    /* Same palette as the gallery, so the two read as one tool. */
    :root {
      --bg: #0b0e14; --panel: #12161f; --line: #1f2532; --line2: #2a3040;
      --ink: #e8eaf0; --soft: #8b93a7; --accent: #c9a227;
      --open: #6ea8fe; --done: #4ec48a; --warn: #e0a15a; --danger: #d2555f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      /* 72px of top padding, not 5vh: the back button is fixed at top 14px and would sit on
         the heading in a short window. */
      font: 15px/1.6 -apple-system, "Segoe UI", sans-serif; padding: 72px 4vw 12vh;
    }
    h1 { font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
         color: var(--soft); font-weight: 500; margin: 0 0 4px; }
    /* Whose notes these are. A tracker that doesn't name its Loop is one bookmark away from
       someone closing a note on the wrong project. */
    h2 { font-size: 20px; font-weight: 600; color: var(--ink); margin: 0 0 8px; }
    .lede { color: var(--soft); max-width: 62ch; margin: 0 0 22px; }
    a { color: var(--open); }

    /* A note is one line of prose next to one thumbnail, so the useful width is set by
       reading, not by the window. Past ~1000px the comment stretches into a single long
       line and the eye has to travel the whole monitor to get from the object name to the
       button that closes it. */
    .bar, .grid { max-width: 1000px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           margin: 0 0 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .count { font: 12px/1 ui-monospace, Consolas, monospace; color: var(--soft);
             padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; }
    .count b { color: var(--ink); font-weight: 600; }
    button {
      font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
      border: 1px solid var(--line2); border-radius: 6px; padding: 7px 13px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button[aria-pressed="true"] { background: #1b2231; border-color: var(--open); color: #fff; }
    button.done { border-color: #2f6b4f; }
    button.done:hover { border-color: var(--done); }
    /* Delete sits at the far end of the row, away from "Mark done" — they are one
       mis-click apart otherwise, and only one of them is reversible in the UI. */
    button.del { margin-left: auto; border-color: #6b2f36; color: #e2a0a6; }
    button.del:hover { border-color: var(--danger); color: #fff; }
    button.del.arm { background: #4a1c22; border-color: var(--danger); color: #fff; }

    .grid { display: grid; gap: 14px; }
    .note {
      display: grid; grid-template-columns: 190px 1fr; gap: 18px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    }
    /* Thumbnail view: the picture leads and the prose condenses — a wall of
       screenshots to scan, where list view is a pile to work through. Same
       cards, same actions; only the shape changes. */
    .grid.thumbs { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); max-width: none; }
    .grid.thumbs .note { grid-template-columns: 1fr; gap: 10px; padding: 12px 14px 14px; }
    .grid.thumbs .comment { font-size: 13px; }
    .grid.thumbs input[type=text] { min-width: 0; flex-basis: 130px; }
    select {
      font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
      border: 1px solid var(--line2); border-radius: 6px; padding: 7px 10px; cursor: pointer;
    }
    select:hover { border-color: var(--accent); }
    select:focus { outline: none; border-color: var(--open); }
    .note[data-status="closed"] { opacity: .55; }
    .note[data-status="closed"]:hover { opacity: 1; }
    .shot { width: 100%; border-radius: 6px; border: 1px solid var(--line2); display: block;
            aspect-ratio: 16/10; object-fit: cover; background: #0c0f16; }
    .noshot { display: grid; place-items: center; color: var(--soft); font-size: 12px; }

    .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
    .id { font: 12px/1 ui-monospace, Consolas, monospace; color: var(--soft); }
    .pill { font: 11px/1 ui-monospace, Consolas, monospace; text-transform: uppercase;
            letter-spacing: .1em; padding: 4px 8px; border-radius: 100px; border: 1px solid; }
    .pill.open { color: var(--open); border-color: #2a4570; }
    .pill.closed { color: var(--done); border-color: #2f6b4f; }
    .obj { font-size: 15px; }
    .meta { font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--soft); margin-bottom: 8px; }
    .comment { margin: 0 0 12px; }
    .res { color: var(--done); font-size: 13px; margin: 0 0 12px; }
    .res:empty { display: none; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type=text] {
      flex: 1 1 260px; min-width: 200px; font: inherit; font-size: 13px;
      color: var(--ink); background: #0d1119; border: 1px solid var(--line2);
      border-radius: 6px; padding: 7px 10px;
    }
    input[type=text]:focus { outline: none; border-color: var(--open); }

    /* Back to the dashboard. Identical markup and #back id on every sub-page so all three
       stay findable with one grep. Fixed rather than in-flow because this page scrolls a
       long way — the body's top padding is set to clear it. */
    #back {
      position: fixed; left: 14px; top: 14px; z-index: 60;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 12px 7px 10px; border-radius: 7px;
      background: rgba(12, 15, 22, .72); border: 1px solid #232a38;
      color: #b9c0d0; text-decoration: none; backdrop-filter: blur(6px);
      font: 12px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    }
    #back:hover { color: #fff; border-color: var(--accent); }

    #msg { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 4vw;
           background: #171c27; border-top: 1px solid var(--line2);
           font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--soft); }
    #msg.warn { color: var(--warn); }
    @media (max-width: 720px) { .note { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a id="back" href="../" title="Back to all loops">← Loops</a>

  <h1>Feedback</h1>
  <h2 id="who">All loops</h2>
  <p class="lede">Every note left on a loop, and whether it has been dealt with. Click a
  thumbnail to open the scene at the exact camera the note was written from, with the object
  already selected.</p>

  <!-- Which Loop, then which state. Two rows, because they are two different questions and
       one row of eight buttons reads as a single undifferentiated pile. -->
  <div class="bar" id="projects"></div>

  <div class="bar">
    <span class="count" id="counts">loading…</span>
    <button id="f-open"   aria-pressed="true">Open</button>
    <button id="f-closed" aria-pressed="false">Done</button>
    <button id="f-all"    aria-pressed="false">All</button>
    <select id="sort" title="Sort the notes">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="status">Open first</option>
      <option value="object">By object</option>
      <option value="scene">By scene</option>
    </select>
    <button id="v-list"   aria-pressed="true"  title="One note per row, full detail">List</button>
    <button id="v-thumbs" aria-pressed="false" title="A wall of screenshots">Thumbnails</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="msg"></div>

<script type="module">
  // Two ways in, exactly like the feedback panel itself: served by tools/dev-server.mjs the
  // notes are live and writable; opened any other way (GitHub Pages, file://) it falls back
  // to the committed notes.json and goes read-only rather than pretending a save worked.
  const msg = document.getElementById('msg');
  const grid = document.getElementById('grid');
  const counts = document.getElementById('counts');

  let notes = [];
  let writable = false;
  let filter = 'open';
  // Which Loop's tracker this is. Each Loop links here with ?project=<id> from the gallery,
  // so the URL is the tracker — bookmarkable, and shareable without explaining which tab to
  // click. 'all' is the everything view, which is what the old single tracker was.
  let slate = { projects: [] };
  let project = new URLSearchParams(location.search).get('project') || 'all';
  let source = null;          // whichever URL actually answered, so polling reuses it
  let lastSeen = '';          // serialised notes, to skip re-rendering when nothing moved

  function say(text, warn = false) {
    msg.textContent = text;
    msg.classList.toggle('warn', warn);
  }

  async function fetchNotes() {
    if (source) {
      const r = await fetch(source, { cache: 'no-store' });
      return r.ok ? await r.json() : null;
    }
    // Try the API first — its presence is what tells us we can write back.
    try {
      const r = await fetch('/api/feedback', { cache: 'no-store' });
      if (r.ok) { source = '/api/feedback'; writable = true; return await r.json(); }
    } catch { /* not on the dev server */ }
    try {
      const r = await fetch('notes.json', { cache: 'no-store' });
      if (r.ok) { source = 'notes.json'; writable = false; return await r.json(); }
    } catch { /* nothing to read */ }
    return null;
  }

  // A note records the SCENE it was written in (`loop`: factory-rt, cat-sequencer). A Loop can own
  // more than one scene, so grouping needs loops.json — which the gallery reads too, so the
  // mapping is stated once. No manifest is not an error: everything falls back to one list.
  function scenesOf(id) {
    return slate.projects.find((p) => p.id === id)?.scenes ?? null;
  }
  function inProject(n) {
    if (project === 'all') return true;
    const scenes = scenesOf(project);
    return scenes ? scenes.includes(n.loop) : true;
  }

  function drawProjects() {
    const name = project === 'all'
      ? 'All loops'
      : (slate.projects.find((p) => p.id === project)?.name ?? project);
    document.getElementById('who').textContent = name;
    document.title = `${name} — feedback`;

    const bar = document.getElementById('projects');
    const withScenes = slate.projects.filter((p) => p.scenes?.length);
    if (!withScenes.length) { bar.replaceChildren(); return; }   // nothing to split by yet
    const mk = (id, label) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-pressed', String(project === id));
      b.onclick = () => {
        project = id;
        // Replace, not push: the tracker is a view, and stacking every filter click into
        // history means Back walks you through them instead of leaving the page.
        const u = new URL(location.href);
        if (id === 'all') u.searchParams.delete('project'); else u.searchParams.set('project', id);
        history.replaceState(null, '', u);
        drawProjects();
        render();
      };
      return b;
    };
    bar.replaceChildren(
      Object.assign(document.createElement('span'), { className: 'count', textContent: 'loop' }),
      ...withScenes.map((p) => mk(p.id, p.name)),
      mk('all', 'All loops'));
  }

  async function load() {
    try {
      const r = await fetch('../loops.json', { cache: 'no-store' });
      if (r.ok) slate = await r.json();
    } catch { /* no manifest — one undivided list, exactly as before */ }
    if (project !== 'all' && !scenesOf(project)) project = 'all';   // stale link in a bookmark

    const fresh = await fetchNotes();
    if (!fresh) { notes = []; say('could not load notes', true); return; }
    notes = fresh;
    lastSeen = JSON.stringify(fresh);
    say(writable
      ? `${notes.filter(inProject).length} notes · live from the dev server · changes are written to feedback/notes.json`
      : 'read-only — no dev server. Run  node tools/dev-server.mjs 5173  to tick notes off.', !writable);
  }

  // notes.json is written by three things — this page, the feedback panel in a loop, and
  // tools/note.mjs from the command line. A page that read once at load would sit there
  // showing a note as open long after it was closed somewhere else, which is exactly the
  // kind of quiet drift a tracker exists to prevent. So poll, and only re-render when the
  // file has actually changed.
  async function poll() {
    if (document.hidden) return;
    try {
      const fresh = await fetchNotes();
      if (!fresh) return;
      const s = JSON.stringify(fresh);
      if (s === lastSeen) return;
      lastSeen = s;
      notes = fresh;
      render();
      say(`updated · ${notes.filter(inProject).filter((n) => n.status !== 'closed').length} open · changed elsewhere just now`);
    } catch { /* transient — the next tick will catch up */ }
  }
  setInterval(poll, 3000);
  // Coming back to the tab should feel instant rather than waiting out the interval.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

  // The note stores an absolute view URL against whatever host it was written on, which is
  // wrong the moment you open this from anywhere else. Rebuild it against the current
  // origin, keeping the query — that is the part that carries the camera.
  function viewHref(n) {
    if (!n.view) return null;
    try {
      const u = new URL(n.view, location.href);
      return u.pathname + u.search;
    } catch { return n.view; }
  }

  function card(n) {
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.id = n.id;
    el.dataset.status = n.status === 'closed' ? 'closed' : 'open';

    const href = viewHref(n);
    const shot = n.shot
      ? `<img class="shot" src="${n.shot}" alt="" loading="lazy">`
      : `<div class="shot noshot">no screenshot</div>`;
    const thumb = href ? `<a href="${href}" title="Open the scene at this camera">${shot}</a>` : shot;

    const when = n.at ? new Date(n.at).toLocaleString() : '';
    const edits = (n.edits && n.edits.length) ? ` · ${n.edits.length} moved` : '';

    el.innerHTML = `
      <div>${thumb}</div>
      <div>
        <div class="head">
          <span class="id">${n.id}</span>
          <span class="pill ${el.dataset.status}">${el.dataset.status}</span>
          <span class="obj">${n.object ?? '(no object)'}</span>
        </div>
        <div class="meta">${[n.material, when + edits].filter(Boolean).join('  ·  ')}</div>
        <p class="comment">${(n.comment ?? '').replace(/</g, '&lt;')}</p>
        <p class="res">${n.resolution ? '✓ ' + n.resolution.replace(/</g, '&lt;') : ''}</p>
        <div class="actions"></div>
      </div>`;

    const actions = el.querySelector('.actions');
    if (href) {
      const open = document.createElement('button');
      open.textContent = 'Open view';
      open.onclick = () => location.assign(href);
      actions.appendChild(open);
    }

    if (n.status === 'closed') {
      const re = document.createElement('button');
      re.textContent = 'Reopen';
      re.onclick = () => update(n, { status: 'open' });
      actions.appendChild(re);
    } else {
      const why = document.createElement('input');
      why.type = 'text';
      why.placeholder = 'what fixed it (optional)';
      why.value = n.resolution ?? '';
      const done = document.createElement('button');
      done.className = 'done';
      done.textContent = 'Mark done';
      done.onclick = () => update(n, { status: 'closed', resolution: why.value.trim() });
      why.onkeydown = (e) => { if (e.key === 'Enter') done.click(); };
      actions.append(why, done);
    }

    // Two clicks, not one. The first arms it and says so; the second within 4 seconds does
    // it. A plain one-click delete beside "Mark done" loses a note and its screenshot, and
    // the poll would rebuild the row a moment later as though nothing had happened.
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.title = 'Filed by mistake? This removes the note. It is kept in feedback/deleted.json.';
    let armedUntil = 0, disarm = 0;
    del.onclick = () => {
      if (Date.now() < armedUntil) { clearTimeout(disarm); remove(n); return; }
      armedUntil = Date.now() + 4000;
      del.textContent = 'Really delete?';
      del.classList.add('arm');
      disarm = setTimeout(() => {
        armedUntil = 0;
        del.textContent = 'Delete';
        del.classList.remove('arm');
      }, 4000);
    };
    actions.appendChild(del);
    return el;
  }

  // A dev server started before an endpoint existed does not 404 as JSON — the request falls
  // through to the STATIC handler, which answers `text/plain: not found: /api/…`. Calling
  // r.json() on that throws `Unexpected token 'o'`, which reads as a bug in the note rather
  // than "your server is old". Check the response shape before parsing, and name the cure.
  async function postJSON(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!(r.headers.get('content-type') || '').includes('json')) {
      const text = (await r.text()).trim();
      throw new Error(r.status === 404 && /^not found/.test(text)
        ? `this dev server has no ${path} — restart it:  node tools/dev-server.mjs 5173`
        : `${r.status} ${text.slice(0, 120)}`);
    }
    const out = await r.json();
    if (!out.ok) throw new Error(out.error || 'request failed');
    return out;
  }

  async function update(n, patch) {
    if (!writable) {
      // No server to write to. Hand over something pasteable rather than silently failing,
      // the same bargain ?review=1 makes on Pages.
      const line = `${n.id} → ${patch.status}${patch.resolution ? ' — ' + patch.resolution : ''}`;
      try { await navigator.clipboard.writeText(line); say('read-only — copied to clipboard: ' + line, true); }
      catch { say('read-only — ' + line, true); }
      return;
    }
    try {
      const out = await postJSON('/api/feedback/update', { id: n.id, ...patch });
      Object.assign(n, out.note);
      render();
      say(`${n.id} → ${n.status}  ·  saved to feedback/notes.json`);
    } catch (e) {
      say('save failed: ' + e.message, true);
    }
  }

  async function remove(n) {
    if (!writable) {
      say('read-only — deleting needs the dev server: node tools/dev-server.mjs 5173', true);
      return;
    }
    try {
      const out = await postJSON('/api/feedback/delete', { id: n.id });
      // Take the server's list back rather than splicing our own, and refresh lastSeen with
      // it — otherwise the 3-second poll sees a difference and re-renders announcing the
      // note "changed elsewhere just now", which is us.
      notes = out.notes;
      lastSeen = JSON.stringify(notes);
      render();
      say(`${n.id} deleted  ·  kept in feedback/deleted.json if you need it back`);
    } catch (e) {
      say('delete failed: ' + e.message, true);
    }
  }

  function render() {
    // A poll can land while someone is halfway through typing a reason. Rebuilding the DOM
    // would throw that away along with the caret, which would read as the page fighting
    // you. Carry every in-progress value across the rebuild, and put the caret back.
    const typed = new Map();
    for (const el of grid.querySelectorAll('.note')) {
      const input = el.querySelector('input[type=text]');
      if (input && input.value) typed.set(el.dataset.id, input.value);
    }
    const focused = document.activeElement;
    const focusedId = focused?.tagName === 'INPUT'
      ? focused.closest('.note')?.dataset.id : null;
    const caret = focusedId ? [focused.selectionStart, focused.selectionEnd] : null;

    // Counts are of THIS Loop, not of the file. A tracker that says "17 total" while showing
    // 4 cards is the pile the split was meant to get rid of.
    const mine = notes.filter(inProject);
    const open = mine.filter((n) => n.status !== 'closed').length;
    const closed = mine.length - open;
    counts.innerHTML = `<b>${open}</b> open · <b>${closed}</b> done · ${mine.length} total`;

    const shown = mine.filter((n) =>
      filter === 'all' ? true : filter === 'open' ? n.status !== 'closed' : n.status === 'closed');
    shown.sort(SORTS[sort] ?? SORTS.newest);
    grid.classList.toggle('thumbs', view === 'thumbs');

    grid.replaceChildren(...(shown.length
      ? shown.map(card)
      : [Object.assign(document.createElement('p'), {
          className: 'lede', textContent: 'Nothing here. Try another filter.' })]));

    for (const [id, value] of typed) {
      const input = grid.querySelector(`.note[data-id="${id}"] input[type=text]`);
      if (input && !input.value) input.value = value;
    }
    if (focusedId) {
      const input = grid.querySelector(`.note[data-id="${focusedId}"] input[type=text]`);
      if (input) { input.focus(); try { input.setSelectionRange(...caret); } catch {} }
    }
  }

  for (const [id, val] of [['f-open', 'open'], ['f-closed', 'closed'], ['f-all', 'all']]) {
    document.getElementById(id).onclick = () => {
      filter = val;
      for (const b of ['f-open', 'f-closed', 'f-all']) {
        document.getElementById(b).setAttribute('aria-pressed', String(b === id));
      }
      render();
    };
  }

  // Sort and view both persist per browser — how you read a tracker is a habit,
  // not a per-visit decision. Ids order chronologically (n001…), so "newest"
  // is an id sort, which also keeps notes filed the same minute in file order.
  const idNum = (n) => Number((/^n(\d+)/.exec(n.id ?? '') ?? [0, 0])[1]);
  const SORTS = {
    newest: (a, b) => idNum(b) - idNum(a),
    oldest: (a, b) => idNum(a) - idNum(b),
    status: (a, b) => (a.status === 'closed') - (b.status === 'closed') || idNum(b) - idNum(a),
    object: (a, b) => String(a.object ?? '').localeCompare(String(b.object ?? '')) || idNum(a) - idNum(b),
    scene:  (a, b) => String(a.loop ?? '').localeCompare(String(b.loop ?? '')) || idNum(b) - idNum(a),
  };
  let sort = localStorage.getItem('fbk-sort') ?? 'newest';
  if (!SORTS[sort]) sort = 'newest';
  const $sort = document.getElementById('sort');
  $sort.value = sort;
  $sort.onchange = () => {
    sort = $sort.value;
    localStorage.setItem('fbk-sort', sort);
    render();
  };

  let view = localStorage.getItem('fbk-view') === 'thumbs' ? 'thumbs' : 'list';
  const setView = (v) => {
    view = v;
    localStorage.setItem('fbk-view', v);
    document.getElementById('v-list').setAttribute('aria-pressed', String(v === 'list'));
    document.getElementById('v-thumbs').setAttribute('aria-pressed', String(v === 'thumbs'));
    render();
  };
  document.getElementById('v-list').onclick = () => setView('list');
  document.getElementById('v-thumbs').onclick = () => setView('thumbs');
  document.getElementById('v-list').setAttribute('aria-pressed', String(view === 'list'));
  document.getElementById('v-thumbs').setAttribute('aria-pressed', String(view === 'thumbs'));

  await load();
  drawProjects();
  render();
</script>
</body>
</html>
