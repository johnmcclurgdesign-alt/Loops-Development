<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dust and Light — look test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
    canvas { display: block; }
    #hint {
      position: fixed; left: 18px; bottom: 16px;
      font: 11px/1.5 -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .12em; text-transform: uppercase;
      color: #56607a; user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">drag to look &middot; scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
    import { createFlyCam }    from '../../tools/flycam.js';

    // ════════════════════════════════════════════════════════════════
    // PALETTE — warm light, cool shadow. These few values control the
    // mood of the whole scene. Change these first when art-directing.
    // ════════════════════════════════════════════════════════════════
    const WARM   = 0xffc27a;   // sunlight coming through the windows
    const COOL   = 0x3f5f85;   // ambient bounce in the shadows
    const AIR    = 0x0e1622;   // the fog / the air itself
    const WALL   = 0x2b2f38;
    const FLOOR  = 0x24262c;

    // room dimensions — everything else is positioned relative to these
    const RW = 30, RH = 15, RD = 24;   // width, height, depth

    // ── renderer ────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // ACES is the film-industry tone curve. It's the single biggest
    // reason a WebGL scene reads as "expensive" instead of "flat".
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(AIR);
    // Exponential fog: distance dissolves into air. This is what gives
    // depth and stops the scene reading as props floating in a void.
    scene.fog = new THREE.FogExp2(AIR, 0.022);

    const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(9, 6, 9);

    const controls = new OrbitControls(camera, renderer.domElement);
    const fly = createFlyCam({ camera, controls });
    window.__fly = fly;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(-1, 3, 0);
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI * 0.495;   // never go under the floor

    // ── the room ────────────────────────────────────────────────────
    // A box turned inside out (BackSide) — we're standing inside it.
    const room = new THREE.Mesh(
      new THREE.BoxGeometry(RW, RH, RD),
      new THREE.MeshStandardMaterial({ color: WALL, roughness: 0.95, side: THREE.BackSide })
    );
    room.position.y = RH / 2;
    room.receiveShadow = true;
    scene.add(room);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(RW, RD),
      new THREE.MeshStandardMaterial({ color: FLOOR, roughness: 0.88 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // ── windows ─────────────────────────────────────────────────────
    // Emissive planes set into the left wall. They don't light anything
    // by themselves — the directional light below does that — but they
    // blow out under bloom and read as blinding daylight.
    const WIN_Z = [-7, 0, 7];
    const winMat = new THREE.MeshBasicMaterial({ color: 0xfff0d8, fog: false });
    for (const z of WIN_Z) {
      const w = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 6.4), winMat);
      w.position.set(-RW / 2 + 0.06, 9.2, z);
      w.rotation.y = Math.PI / 2;
      scene.add(w);
    }

    // ── lighting ────────────────────────────────────────────────────
    scene.add(new THREE.HemisphereLight(COOL, 0x11161f, 0.85));

    // the key: hard warm daylight raking in from the window wall
    const key = new THREE.DirectionalLight(WARM, 3.6);
    key.position.set(-26, 20, 4);
    key.target.position.set(4, 0, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 70;
    key.shadow.camera.left = -20;
    key.shadow.camera.right = 20;
    key.shadow.camera.top = 20;
    key.shadow.camera.bottom = -20;
    key.shadow.bias = -0.0015;
    scene.add(key, key.target);

    // cool bounce off the far wall so shadows aren't dead black
    const fill = new THREE.DirectionalLight(0x6f90c0, 0.55);
    fill.position.set(12, 5, -10);
    scene.add(fill);

    // ── light shafts ────────────────────────────────────────────────
    // Real volumetric light is expensive. This is two crossed additive
    // planes per window with a gradient shader. Once bloom hits it, the
    // eye cannot tell the difference.
    const shaftMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: {
        uColor:   { value: new THREE.Color(WARM) },
        uOpacity: { value: 0.13 },
        uTime:    { value: 0 },
        uSeed:    { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3  uColor;
        uniform float uOpacity, uTime, uSeed;
        varying vec2 vUv;
        void main() {
          // brightest at the window (top), weaker by the time it lands
          float fall = mix(0.22, 1.0, pow(vUv.y, 0.85));
          // soft edges across the width so there's no hard silhouette
          float edge = pow(sin(vUv.x * 3.14159), 1.4);
          // slow breathing so the haze feels alive, not like a solid object
          float drift = 0.88 + 0.12 * sin(uTime * 0.3 + uSeed + vUv.y * 2.0);
          gl_FragColor = vec4(uColor, uOpacity * fall * edge * drift);
        }`
    });

    const shafts = [];
    WIN_Z.forEach((z, i) => {
      const g = new THREE.Group();
      g.position.set(-RW / 2 + 0.2, 12.4, z);
      g.rotation.z = 0.86;            // tips the beam into the room
      g.rotation.y = -0.06;

      const mat = shaftMat.clone();
      mat.uniforms.uSeed.value = i * 2.1;

      // two planes crossed at 90° so the beam never vanishes edge-on
      for (let k = 0; k < 2; k++) {
        const p = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 20), mat);
        p.position.y = -10;           // hang it below the group origin
        p.rotation.y = k * Math.PI / 2;
        g.add(p);
      }
      scene.add(g);
      shafts.push(mat);
    });

    // ── props ───────────────────────────────────────────────────────
    // Deliberately plain boxes and cylinders. The whole point of this
    // test is that ATMOSPHERE carries the image, not the models. What
    // you build in Blender drops onto this exact lighting setup.
    const crateMat = new THREE.MeshStandardMaterial({ color: 0x6a5941, roughness: 0.88 });
    const jarMat   = new THREE.MeshStandardMaterial({ color: 0x6f8a52, roughness: 0.3, metalness: 0.15 });

    function crate(x, y, z, s, ry) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), crateMat);
      m.position.set(x, y + s / 2, z);
      m.rotation.y = ry;
      m.castShadow = m.receiveShadow = true;
      scene.add(m);
    }
    function jar(x, z, h) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.44, h, 22), jarMat);
      m.position.set(x, h / 2, z);
      m.castShadow = m.receiveShadow = true;
      scene.add(m);
    }

    crate(-3.4,   0, -2.0, 2.4,  0.28);
    crate(-3.0, 2.4, -2.4, 1.6, -0.14);
    crate( 2.6,   0,  1.2, 2.0, -0.40);
    crate( 3.8,   0, -4.2, 2.8,  0.10);
    crate( 3.6, 2.8, -3.9, 1.4,  0.52);
    crate(-7.2,   0,  3.6, 1.8,  0.20);
    crate( 0.2,   0, -6.4, 2.2, -0.26);
    crate( 7.4,   0, -1.0, 2.3,  0.44);

    for (let i = 0; i < 8; i++) jar(-1.6 + i * 0.92, 3.4, 1.15 + (i % 3) * 0.14);
    for (let i = 0; i < 5; i++) jar(-8.4 + i * 0.92, -3.0, 1.05);

    // a column to break the silhouette and catch the rim light
    const column = new THREE.Mesh(
      new THREE.CylinderGeometry(0.7, 0.8, RH, 20),
      new THREE.MeshStandardMaterial({ color: 0x33363e, roughness: 0.96 })
    );
    column.position.set(-9.5, RH / 2, -6.5);
    column.castShadow = column.receiveShadow = true;
    scene.add(column);

    // ── dust ────────────────────────────────────────────────────────
    // Thousands of tiny additive motes drifting in the air. Cheapest
    // trick in the book, and the one people always notice.
    const DUST = 3000;
    const dustPos = new Float32Array(DUST * 3);
    const phase   = new Float32Array(DUST);
    for (let i = 0; i < DUST; i++) {
      dustPos[i * 3 + 0] = (Math.random() - 0.5) * (RW - 1);
      dustPos[i * 3 + 1] =  Math.random() * (RH - 1);
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * (RD - 1);
      phase[i] = Math.random() * Math.PI * 2;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));

    // Points are square by default. A soft radial sprite turns them into
    // round out-of-focus motes instead of pixels — this one detail is the
    // difference between "dust" and "stars".
    function softDot() {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0.0, 'rgba(255,255,255,1)');
      g.addColorStop(0.25, 'rgba(255,255,255,0.55)');
      g.addColorStop(1.0, 'rgba(255,255,255,0)');
      const ctx = c.getContext('2d');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
      color: WARM, size: 0.085, map: softDot(), transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    })));

    // ── post-processing ─────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    // Bloom: bright things bleed. This is what makes the windows blow
    // out and the shafts glow instead of sitting flat on the image.
    composer.addPass(new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.75,   // strength
      0.9,    // radius
      0.20    // threshold — only pixels brighter than this bloom
    ));

    // Vignette + film grain. Subtle, but it stops the image reading as
    // "computer graphics" and starts it reading as "photographed".
    const grade = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime:    { value: 0 },
        uGrain:   { value: 0.022 },
        uVig:     { value: 0.85 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime, uGrain, uVig;
        varying vec2 vUv;
        float rand(vec2 c) { return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
        void main() {
          vec4 col = texture2D(tDiffuse, vUv);
          vec2 d = vUv - 0.5;
          col.rgb *= 1.0 - uVig * dot(d, d) * 0.9;              // vignette
          col.rgb += (rand(vUv + fract(uTime)) - 0.5) * uGrain; // animated grain
          gl_FragColor = col;
        }`
    });
    composer.addPass(grade);
    composer.addPass(new OutputPass());

    // ── loop ────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    let userTouched = false;
    controls.addEventListener('start', () => { userTouched = true; });

    let prevT = 0;   // getElapsedTime() consumes the delta, so getDelta() would read ~0
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      const dt = t - prevT; prevT = t;
      fly.update(dt);

      for (const m of shafts) m.uniforms.uTime.value = t;
      grade.uniforms.uTime.value = t;

      // dust rises slowly and sways sideways
      const p = dustGeo.attributes.position.array;
      for (let i = 0; i < DUST; i++) {
        p[i * 3 + 1] += 0.006;
        p[i * 3 + 0] += Math.sin(t * 0.25 + phase[i]) * 0.0018;
        if (p[i * 3 + 1] > RH - 1) p[i * 3 + 1] = 0;   // wrap back to the floor
      }
      dustGeo.attributes.position.needsUpdate = true;

      // slow drift until the viewer takes over — this is what makes it
      // a loop rather than a still render. Elliptical so it stays inside
      // the room on all sides.
      if (!userTouched) {
        camera.position.x = 2.5 + Math.sin(t * 0.05) * 10.5;
        camera.position.z =       Math.cos(t * 0.05) * 9.5;
        camera.position.y = 6.2 + Math.sin(t * 0.085) * 1.1;
        camera.lookAt(controls.target);
      }

      controls.update();
      composer.render();
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
