                       0.85 + 0.15 * (bounce - 1 + done / total) / bounces);
          },
        });
        bakeUI.style.display = 'none';
        gi.setIntensity(rig.visible ? RT_GI : 0);
        state.gi = `${gi.dims.x}x${gi.dims.y}x${gi.dims.z} (${r.probes}) ${r.ms}ms`;
        writeHud();
        } finally {
          for (const m of screenMats) m.emissiveIntensity = TV_GLOW;
        }
      }
      // Ship the volume next to the glb; ?gibake=1 forces a fresh one while dialling.
      async function loadOrBake() {
        loadUI.set('lighting the room…', 0.85);
        if (!GI_FORCE) {
          try {
            const res = await fetch('../../assets/dripping-pickle/gi_volume.bin');
            if (res.ok && gi.load(await res.arrayBuffer())) {
              gi.setIntensity(rig.visible ? RT_GI : 0);
              state.gi = `cached ${gi.dims.x}x${gi.dims.y}x${gi.dims.z}`;
              writeHud();
              return;
            }
          } catch { /* no cache yet — bake */ }
        }
        await runBake();
      }
      await loadOrBake();
      loadUI.set('', 1);
      loadUI.done();

      window.__rt = {
        rig, sun, skylights, bounce, gi, apertures, buildingBox,
        setRigEnabled, setSunAngles, runBake, volPass,
        saveGI: () => {
          const blob = new Blob([gi.serialise()], { type: 'application/octet-stream' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'gi_volume.bin';
          a.click();
        },
      };

      writeHud();

      import('../../tools/feedback.js').then(({ initFeedback }) => {
        initFeedback({ scene, camera, renderer, controls,
                       pickRoot: pickables, loop: 'dripping-pickle',
                       renderFrame: () => renderFrame(),
                       // Selecting and dragging props is developer/review work.
                       // The module still loads in presentation mode because the
                       // telly travel rides on its flyTo — see PRESENT above.
                       pick: !PRESENT });
      });
    }, (ev) => {
      if (ev.total) {
        hud.textContent = `loading ${(100 * ev.loaded / ev.total).toFixed(0)}%`;
        loadUI.set('loading the room…', 0.7 * ev.loaded / ev.total);
      }
    }, (e) => { hud.textContent = 'GLB FAILED: ' + e; loadUI.fail('the room failed to load'); });

    function writeHud(extra = '') {
      hud.textContent =
        `meshes ${state.meshes}  tris ${Math.round(state.tris).toLocaleString()}  non-casters ${state.noCast}\n` +
        `camera ${state.cam}  exposure ${renderer.toneMappingExposure}\n` +
        `apertures ${apertures.panes.length} (${apertures.roof.length} roof)  gi ${state.gi}\n` +
        (fly ? fly.hint : '') + extra;
    }

    // ── frame loop ──────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    const gateFwd = new THREE.Vector3(), gateSun = new THREE.Vector3();
    const sunProj = new THREE.Vector3();
    let last = 0;
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      const dt = Math.min(t - last, 0.1);
      last = t;
      if (fly) fly.update(dt);
      if (controls) controls.update();
      if (tvTick) tvTick(t);
      if (tvUX) tvUX.tick(dt);
      if (catMixer) catMixer.update(dt);
      tvVidExposure.value = renderer.toneMappingExposure;   // Brightness dial follows
      adaptAA(t, dt);
      lens.update(t);
      // Flare only when the camera faces the SUN — a threshold cannot tell the
      // sun from a bright TV (the screens are far brighter than the glazing),
      // so the gate is directional. Fades in over ~17° as the view tilts up
      // toward the skylights; the default level view sits fully gated off.
      camera.getWorldDirection(gateFwd);
      gateSun.copy(sunDirection(sunAz, sunEl)).negate();
      lens.setSunGate(THREE.MathUtils.smoothstep(gateFwd.dot(gateSun), 0.45, 0.75));
      // The flare is ANCHORED at the sun's screen position — every ghost is
      // drawn along the sun→centre axis, nothing is harvested from bright
      // pixels (that harvest is how the TVs ghosted). Project a point far
      // along the sun ray; behind the camera the projection mirrors, so park
      // it far off-frame instead (the shader fades to zero out there).
      if (gateFwd.dot(gateSun) > 0.05) {
        sunProj.copy(camera.position).addScaledVector(gateSun, 1000).project(camera);
        lens.setSunScreen((sunProj.x + 1) / 2, (sunProj.y + 1) / 2);
      } else {
        lens.setSunScreen(0.5, 3.0);
      }
      // focus rides the orbit target — the thing you are looking at is in focus
      if (bokehPass.enabled && controls) {
        bokehPass.uniforms.focus.value =
          camera.position.distanceTo(controls.target);
      }

      // Drift wraps the RENDER only — applied after the controls have settled the
      // real pose, undone before they next read it. The prepasses sit inside
      // the wrapper so the shafts march from the same drifted eye as the frame.
      drift.apply(t);
      renderFrame(t);
      drift.restore();
      lastFrameT = t;
    });

    // ★ The prepasses only need DEPTH, so they render with a depth-only override —
    // rendering them with full materials ran PCSS + GI + every texture a second
    // (and third) time per frame and threw all of it away: measured 18.8 ms →
    // 11.9 ms at the loop camera from this change alone. Two subtleties:
    // - Anything with depthWrite:false (glass, sky, dust) is HIDDEN for the pass,
    //   not overridden — under an override it would write depth, and a beam seen
    //   through a pane dies at the glass. Checked per frame, not cached: cheap
    //   (hundreds of objects), and it survives materials changing after load.
    // - The override ignores per-material side, so the depth material is
    //   DoubleSide — a wall whose front faces away must still stop the march.
    const depthOnlyMat = new THREE.MeshDepthMaterial();
    depthOnlyMat.side = THREE.DoubleSide;
    const hiddenForDepth = [];
    function renderDepthOnly(target) {
      scene.traverse((o) => {
        const m = o.material;
        if (!m || !o.visible) return;
        const noWrite = Array.isArray(m) ? m.every((x) => x.depthWrite === false)
                                         : m.depthWrite === false;
        if (noWrite) { o.visible = false; hiddenForDepth.push(o); }
      });
      scene.overrideMaterial = depthOnlyMat;
      const prevTarget = renderer.getRenderTarget();
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(prevTarget);
      scene.overrideMaterial = null;
      for (const o of hiddenForDepth) o.visible = true;
      hiddenForDepth.length = 0;
    }

    // One full frame: every prepass plus the composer chain. The animation loop
    // calls it per frame, and the feedback panel calls it for screenshots — so a
    // captured shot carries the same grade, AO, lens and letterbox as the screen.
    let lastFrameT = 0;
    function renderFrame(t = lastFrameT) {
      // the MSAA beauty render n8ao composites from (see the AO block up top)
      if (beautyRT) {
        renderer.setRenderTarget(beautyRT);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
      }
      // props-only depth for the AO's prop channel (props live on layer 1 too)
      if (aoPass && state.props) {
        camera.layers.set(1);
        renderDepthOnly(propsDepthRT);
        camera.layers.set(0);
      }
      // depth prepass for the shafts — needs its OWN target, sampling the buffer you
      // are drawing into is a feedback loop
      if (volPass.enabled) {
        renderDepthOnly(depthRT);
      }
      looks.render(t);
    }

    // One function owns every size-dependent target, because the render scale
    // can now change at runtime (adaptive AA below) as well as on resize.
    function applyRenderScale(f) {
      renderScale = f;
      const pr = Math.min(devicePixelRatio, 2) * f;
      renderer.setPixelRatio(pr);
      renderer.setSize(innerWidth, innerHeight);
      applyFov();
      looks.composer.setPixelRatio(pr);
      looks.setSize(innerWidth, innerHeight);
      if (aoPass) aoPass.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      lens.setAspect(innerWidth / innerHeight);
      depthRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      propsDepthRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
      if (beautyRT) beautyRT.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
    }
    // ★ A RESIZE RESETS THE SSAA LADDER (2026-08-19). The old listener carried
    // renderScale through the resize, and adaptAA only ever measures ONCE —
    // so 1.25x earned in a small window (easily under 10.5 ms now) survived a
    // maximise to 4K: 1.56x of 8.3 MP, 30+ ms frames, and a GPU-saturated tab
    // drags the whole browser's compositing with it. Reported as "it gets
    // worse over time" — the "over time" was the window getting bigger after
    // the one-shot measurement. Drop to 1x on any resize and re-earn at the
    // size actually on screen.
    addEventListener('resize', () => {
      if (!SSAA_FORCED && renderScale !== 1) renderScale = 1;
      aa.settled = false; aa.acc = [];
      applyRenderScale(renderScale);
    });

    // ── adaptive AA headroom ────────────────────────────────────────────────
    // "Drift is cool but ants ruin the scene" — the residual shimmer under
    // drift wants supersampling, but a flat 1.25x would ruin lesser hardware.
    // So the loop EARNS it: after the scene settles, average 120 frames; step
    // up to 1.25x only under 10.5 ms (1.56x the pixels lands ~15 ms, still
    // 60 fps), and step straight back down if the average ever passes 15.5.
    // ?ssaa=1.5 forces a scale, ?ssaa=1 pins it off.
    const SSAA_FORCED = parseFloat(q.get('ssaa') ?? '0');   // 0 = auto
    const aa = { acc: [], settled: false, lastT: 0 };
    function adaptAA(t, dt) {
      if (SSAA_FORCED || aa.settled || t < 6 || !state.props) return;
      aa.acc.push(dt * 1000);
      if (aa.acc.length < 120) return;
      const avg = aa.acc.reduce((a, b) => a + b, 0) / aa.acc.length;
      aa.acc = [];
      if (renderScale === 1 && avg < 10.5) applyRenderScale(1.25);   // earn it, then re-measure
      else if (renderScale > 1 && avg > 15.5) { applyRenderScale(1); aa.settled = true; }
      else aa.settled = true;
    }
    if (SSAA_FORCED && SSAA_FORCED !== 1) applyRenderScale(SSAA_FORCED);
  </script>
</body>
</html>
