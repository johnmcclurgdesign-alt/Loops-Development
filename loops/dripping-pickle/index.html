<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Dripping Pickle — Warehouse</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0b0d; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 14px; bottom: 12px;
      font: 11px/1.6 ui-monospace, Consolas, monospace;
      color: #7f8796; user-select: none; white-space: pre;
    }
    /* The GI bake takes seconds; a blank dark room with no explanation reads as broken. */
    #bake {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font: 12px/1.8 ui-monospace, Consolas, monospace; color: #cbd3e1;
      background: rgba(12,14,18,0.86); border: 1px solid #2a2f3a; border-radius: 6px;
      padding: 14px 18px; text-align: center; min-width: 240px; display: none;
    }
    #bakebar { height: 3px; background: #2a2f3a; margin-top: 8px; border-radius: 2px; overflow: hidden; }
    #bakebar > i { display: block; height: 100%; width: 0; background: #6ea8fe; }
    #back {
      position: fixed; left: 14px; top: 14px; z-index: 60;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 12px 7px 10px; border-radius: 7px;
      background: rgba(12, 15, 22, .72); border: 1px solid #232a38;
      color: #b9c0d0; text-decoration: none; backdrop-filter: blur(6px);
      font: 12px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em;
    }
    #back:hover { color: #fff; border-color: #c9a227; }
    /* Loading screen: covers everything until the room is fully lit (glb +
       props + GI) and a few frames have rendered, so the first thing anyone
       sees is the finished image, never a half-loaded room. */
    #load {
      /* above the looks panel (9998) and feedback panel (9999) — "hides
         everything" includes the UI, not just the room */
      position: fixed; inset: 0; z-index: 20000; background: #0a0b0d;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .8s ease;
    }
    #load .inner { text-align: center; font: 12px/2 ui-monospace, Consolas, monospace;
      color: #8b93a7; }
    #load b { display: block; font: 600 21px/1.4 -apple-system, "Segoe UI", sans-serif;
      color: #cbd3e1; letter-spacing: .06em; margin-bottom: 4px; }
    #loadbar { width: 220px; height: 3px; background: #20242e; border-radius: 2px;
      overflow: hidden; margin: 12px auto 0; }
    #loadbar > i { display: block; height: 100%; width: 0; background: #6ea8fe;
      transition: width .25s; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
      "three/examples/jsm/": "https://unpkg.com/three@0.169.0/examples/jsm/",
      "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.9.4/dist/N8AO.js",
      "postprocessing": "../../tools/stub-postprocessing.js"
    }
  }
  </script>
</head>
<body>
  <a id="back" href="../../">&#8592; loops</a>
  <div id="hud">loading&hellip;</div>
  <div id="bake"><span id="baketxt">baking light&hellip;</span><div id="bakebar"><i></i></div></div>
  <div id="load"><div class="inner">
    <b>The Dripping Pickle</b>
    <span id="loadtxt">loading the room&hellip;</span>
    <div id="loadbar"><i></i></div>
  </div></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }  from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { N8AOPass } from 'n8ao';
    import { createLooks } from '../../tools/looks.js';
    import { createFlyCam } from '../../tools/flycam.js';
    import { createGIVolume } from '../../tools/gi-volume.js';
    import * as PCSS from '../../tools/pcss.js';
    import { VolumetricLightPass } from '../../tools/volumetrics.js';
    import { createLens } from '../../tools/lens.js';
    import { createDriftCam } from '../../tools/driftcam.js';
    import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
    import { restoreView } from '../../tools/feedback.js';

    const q = new URLSearchParams(location.search);

    // ?ui=0 — presentation mode: no HUD, no feedback panel (pair with
    // &looks=0 for no dials either). The panels' modules still load, so the
    // TV click/hover interaction keeps its flyTo. CSS rather than skipping
    // init, because #fbk mounts asynchronously.
    // It ALSO locks the camera — see setCamLock(). The visitor's only
    // navigation is clicking a telly; dev/review modes keep every control.
    const PRESENT = q.get('ui') === '0';
    if (PRESENT) {
      const s = document.createElement('style');
      s.textContent = '#hud, #fbk { display: none !important; }';
      document.head.appendChild(s);
    }

    // ── grade ───────────────────────────────────────────────────────────────
    // The target is reference/warehouse_lighting_reference (in chat, 2026-08-18):
    // soft bounce-dominated daylight, ONE bright pool under the skylight, deep
    // contact shadow in corners and roof structure, warm brick against cool
    // shadow, no hard god-rays. Starting values lean that way; the dials finish it.
    // Re-graded 2026-08-19 against the Blender render, on the art director's
    // brief: "push to get our shadows to come to life — the image is very
    // underexposed". The lift is mostly BOUNCE and FILL (gi/skyl/envi), not
    // exposure — three's ACES has no shadow lift, so raising exp alone blows
    // the sun pool before the desk detail arrives. skyl/envi feed the BAKE:
    // re-bake after touching them or the shipped bounce contradicts the rig.
    const EXPOSURE   = parseFloat(q.get('exp')    ?? '2.2');
    const RT_SUN_AZ  = parseFloat(q.get('sunaz')  ?? '143');
    const RT_SUN_EL  = parseFloat(q.get('sunel')  ?? '56');
    // Defaults re-dialled live by the art director 2026-08-19 (Copy settings
    // URL): hard bright sun (5.31 at size 0.0139, was 2.1 at 0.075), quieter
    // skylights and bounce, walls on direct light alone (giwall 0).
    const RT_SUN     = parseFloat(q.get('sun')    ?? '5.3098');
    // Apparent size of the source, as a tangent. The real sun is 0.0046. The
    // soft-pool look (0.075) is out as of the 2026-08-19 re-dial — the art
    // direction went to a near-hard sun and crisp pool edges.
    const RT_SUNANG  = parseFloat(q.get('sunang') ?? '0.0139');
    // Grounding is the SKYLIGHT SHADOW, not the AO (2026-08-19, second try).
    // Screen-space AO can only smudge the surface BEHIND an object — at any
    // radius it detaches and floats. The skyShadow light casts real geometry-
    // anchored soft shadows under every prop, so part of the top light moved
    // from the unshadowed skylights (2.0 -> 1.4) into it (0 -> 0.9), and the
    // AO dropped to a tight supporting role (radii 0.5/0.6, shade 1.1).
    const RT_SKYL    = parseFloat(q.get('skyl')   ?? '0.9384');
    const RT_SKYSHADOW = parseFloat(q.get('skyshadow') ?? '0.9');
    const RT_GI      = parseFloat(q.get('gi')     ?? '1.0781');
    // Walls take a reduced share of the volume (per-material giGain). Fitted
    // 2026-08-19 against DP_RT_Lighting_Reference.jpg: wall patches read
    // 1.6-2.5x the render's while the floor did not — walls face the open room
    // so every probe agrees with them, and the flat lift read as sheen.
    const RT_GIWALL  = parseFloat(q.get('giwall') ?? '0');
    const RT_GIBIAS  = parseFloat(q.get('gibias') ?? '0.33');
    const RT_GIVIS   = parseFloat(q.get('givis')  ?? '0');
    const RT_GIVALID = parseFloat(q.get('givalid')?? '0.2');
    const RT_ENVI    = parseFloat(q.get('envi')   ?? '0.18');
    const RT_BOUNCE  = parseFloat(q.get('bounce') ?? '0');
    const RT_AO      = q.get('ao') !== '0';
    // The GTAO param family (aoamt/aothick/aofrad/aofamt) retired with GTAO
    // itself — n8ao reads aorad/aofall directly at its construction below.
    // ── the TV wall ─────────────────────────────────────────────────────────
    // The screens share one emissive atlas (`Screen_Glow`). The pack's baked
    // multicolour noise read as placeholder, so the atlas is REPLACED at load
    // with live procedural antenna static — one canvas redrawn at ~24 fps:
    // upscaled white noise (soft, not pixel-crisp), a vertical-hold band
    // rolling down, occasional horizontal tearing, scanlines, tube flicker.
    // Every TV maps its own UV window onto the one canvas, so each screen
    // shows DIFFERENT static for free, and one texture upload serves them all.
    // Green comes from the emissive tint (because pickles), and the screens
    // are overdriven DURING THE GI BAKE so the coarse probe grid actually
    // catches the small emitters. Look target: the Blender reference render.
    const TV_GREEN = new THREE.Color(0.25, 1.0, 0.22);
    // "Soft glow, nothing distracting" (art direction 2026-08-19) — 2.5 on
    // screen, 8 for the bake. 5/14 was the first pass and read as neon.
    const TV_GLOW  = parseFloat(q.get('tvglow') ?? '2.5'); // on screen
    // 4, was 8: at 8 the coarse probe grid wrapped the green onto the wall
    // BEHIND the TVs (n025 — "the light should only project forward"). 4 keeps
    // the forward pool on the desk and starves the backwash.
    const TV_GLOW_BAKE = 4;
    const TV_FPS = 24;           // static redraw rate — CRT cadence, not 60
    const screenMats = new Set();
    let tvStaticTex = null, tvTick = null;

    // n038, then widened (chat 2026-08-19): EVERY screen plays the pickles
    // loop, synced — one <video>, one decode, broadcast-style. ?tvvideo=0
    // falls back to the still static everywhere, ?tvvidmesh=<name> plays it
    // on just that screen again, ?tvvidglow= dials the screens.
    const TV_VIDEO_MESH = q.get('tvvidmesh') ?? 'all';
    const TV_VIDEO      = q.get('tvvideo') !== '0';
    const TV_VIDEO_GLOW = parseFloat(q.get('tvvidglow') ?? String(TV_GLOW));

    // Click-a-telly: hover wakes the screen, click flies the camera to it,
    // clicking the screen again flies home. ?tvfocus=0 turns it all off.
    const TV_FOCUS = q.get('tvfocus') !== '0';
    let tvUX = null;          // built once the props are in (initTVFocus)
    let homePose = null;      // { pos, tgt } — set where HOME_POS is defined
    let catMixer = null;      // drives the dozing cat's clip

    function makeTVStatic(orig) {
      const W = orig.image.width, H = orig.image.height;
      const cnv = document.createElement('canvas');
      cnv.width = W; cnv.height = H;
      const ctx = cnv.getContext('2d');
      // Noise at EIGHTH res, upscaled with smoothing — that is the blur, with
      // no per-frame filter cost. It was quarter res, but ~2px features at
      // atlas scale MINIFY on screen and shimmer as they repaint — reported as
      // "marching ants", and they survived turning every lens effect off
      // because the ants were in the content, not the resample. Same reason
      // the scanlines dropped from 0.35 to 0.2 alpha: a 1px line at high
      // contrast is the worst aliaser in the building.
      const small = document.createElement('canvas');
      small.width = W >> 3; small.height = H >> 3;
      const sctx = small.getContext('2d');
      const grain = sctx.createImageData(small.width, small.height);
      const sl = document.createElement('canvas');
      sl.width = 1; sl.height = 3;
      const slc = sl.getContext('2d');
      slc.fillStyle = 'rgba(0,0,0,0.2)';
      slc.fillRect(0, 2, 1, 1);
      const scan = ctx.createPattern(sl, 'repeat');

      // clone() keeps flipY/colorSpace/wrap/channel from the glb's texture.
      // Mip filtering is explicit: minified animated noise with a bare linear
      // filter crawls; trilinear + anisotropy settles it (mips regenerate on
      // every needsUpdate, which is the price of animated screens).
      const tex = orig.clone();
      tex.image = cnv;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.anisotropy = 8;
      tex.needsUpdate = true;

      // Phosphor persistence: fresh noise blends 50/50 over the previous frame
      // in its own accumulator, so the frame-to-frame delta halves — that
      // delta is what read as marching ants on every screen (a real CRT
      // ghosts; only a broken shader strobes). The accumulator is separate
      // from the output canvas because the scanlines/band redraw every tick —
      // persisted IN PLACE they compound toward black.
      const accum = document.createElement('canvas');
      accum.width = W; accum.height = H;
      const actx = accum.getContext('2d');
      let last = -1;
      tvTick = (t) => {
        if (t - last < 1 / TV_FPS) return;
        last = t;
        const d = grain.data;
        for (let i = 0; i < d.length; i += 4) {
          // clamped range: full-contrast noise strobes; 80–215 reads as static
          const v = (80 + Math.random() * 135) | 0;
          d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
        }
        sctx.putImageData(grain, 0, 0);
        actx.imageSmoothingEnabled = true;
        actx.globalAlpha = 0.5;
        actx.drawImage(small, 0, 0, W, H);
        actx.globalAlpha = 1;
        ctx.imageSmoothingEnabled = true;
        ctx.globalAlpha = 0.92 + Math.random() * 0.08;   // tube flicker (gentler)
        ctx.drawImage(accum, 0, 0);
        ctx.globalAlpha = 1;
        // vertical-hold roll — a dark band sweeping down, drawn twice so the
        // wrap at the top never pops
        const bh = H * 0.16;
        const y = ((t * 0.09) % 1) * (H + bh) - bh;
        for (const yy of [y, y - H - bh]) {
          const g = ctx.createLinearGradient(0, yy, 0, yy + bh);
          g.addColorStop(0, 'rgba(0,0,0,0)');
          g.addColorStop(0.65, 'rgba(0,0,0,0.5)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, yy, W, bh);
        }
        // occasional horizontal tearing — bad reception, not damage, so brief
        if (Math.random() < 0.15) {
          const ty = Math.random() * H, th = 3 + Math.random() * 14;
          const dx = (Math.random() - 0.5) * W * 0.06;
          ctx.drawImage(cnv, 0, ty, W, th, dx, ty, W, th);
        }
        ctx.fillStyle = scan;
        ctx.fillRect(0, 0, W, H);
        tex.needsUpdate = true;
      };
      tvTick(0);   // paint one composed frame either way — the screens stay lit
      // ★ THE STATIC IS A STILL FRAME BY DEFAULT (2026-08-19). Every canvas→
      // texture upload mid-frame stalls the GPU pipeline while a TV is in view:
      // measured in the reporting Chrome at 2274x1214, p95 34.7 ms with 15/200
      // frames over 28 ms animating, against p95 14.0 / zero spikes frozen —
      // and "fps drops only when the TVs are on screen" is the tell, because
      // culled TVs never bind the texture so the upload is skipped. Double-
      // buffered textures, CPU-backed canvases and dropping the mips were all
      // tried and none moved it — the upload path itself is the stall, so the
      // only clean cure is not uploading. ?tvanim=1 brings the live static
      // back for A/B; the real fix, if the motion is ever wanted again, is
      // generating the static in the fragment shader (zero uploads).
      if (q.get('tvanim') !== '1') tvTick = null;
      return tex;
    }

    // ── the video screen (n038) ─────────────────────────────────────────────
    // Runs AFTER the mesh's Screen_Glow got its normal static setup, so the
    // clone inherits everything and only the screen content changes. Three
    // things are non-obvious:
    // - The screens share ONE ATLAS and each screen's UVs sample a window of
    //   it, so a raw VideoTexture would show a crop. The texture transform
    //   remaps this mesh's UV window onto the whole frame instead.
    // - The material is CLONED for this one mesh — Screen_Glow is shared, and
    //   swapping its map would put the video on every TV. The clone's emissive
    //   goes WHITE: the shared green tint multiplies the emissiveMap, and it
    //   would repaint the video's grade.
    // - Material.clone() does NOT carry onBeforeCompile, so the clone joins
    //   litMaterials to get its own GI + PCSS patch in the normal pass below.
    // ONE video element feeds every screen — one decode, all screens on the
    // same frame. Each screen still gets its OWN VideoTexture instance,
    // because the atlas-window remap lives in the texture transform and every
    // screen's window is different.
    let tvVid = null;
    // Exposure feeds the screens' inverse-ACES (below) and must FOLLOW the
    // Brightness dial — synced every frame in the loop. One shared uniform.
    const tvVidExposure = { value: EXPOSURE };
    function ensureTVVideo() {
      if (tvVid) return tvVid;
      tvVid = document.createElement('video');
      tvVid.src = '../../assets/dripping-pickle/tv_pickles_sinking.mp4';
      tvVid.loop = true; tvVid.muted = true; tvVid.playsInline = true;
      // muted + playsInline autoplays in every current browser; if a policy
      // still blocks it, the first click starts it (the static shows till then)
      tvVid.play().catch(() => addEventListener('pointerdown', () => tvVid.play(), { once: true }));
      return tvVid;
    }
    function playVideoOnScreen(mesh) {
      const m = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      const orig = m.emissiveMap;
      const vid = ensureTVVideo();
      const vtex = new THREE.VideoTexture(vid);   // no mips, Linear — nothing to regenerate
      vtex.colorSpace = THREE.SRGBColorSpace;
      if (orig) {
        vtex.flipY = orig.flipY;
        vtex.wrapS = orig.wrapS; vtex.wrapT = orig.wrapT;
        vtex.channel = orig.channel;
      }
      const uv = mesh.geometry.getAttribute(vtex.channel ? `uv${vtex.channel}` : 'uv');
      let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
      for (let i = 0; i < uv.count; i++) {
        const u = uv.getX(i), v = uv.getY(i);
        u0 = Math.min(u0, u); v0 = Math.min(v0, v);
        u1 = Math.max(u1, u); v1 = Math.max(v1, v);
      }
      vtex.repeat.set(1 / (u1 - u0), 1 / (v1 - v0));
      vtex.offset.set(-u0 / (u1 - u0), -v0 / (v1 - v0));
      const vm = m.clone();
      vm.emissiveMap = vtex;
      vm.emissive.set(1, 1, 1);
      vm.emissiveIntensity = TV_VIDEO_GLOW;
      // ★ SHOW THE VIDEO'S OWN COLOURS THROUGH ACES ("fix the color so it's
      // close to the original"). At glow x exposure the video landed deep in
      // the ACES shoulder — washed out and hue-shifted toward yellow. The fix
      // is looks.js's trick run in reverse at the SOURCE: pre-invert the ACES
      // fit (exact algebraic inverse — a ratio of quadratics is one quadratic
      // solve) and divide by exposure, so OutputPass lands each pixel back on
      // the video's own value. emissiveIntensity still scales ABOUT the base
      // glow, so the hover wake-up and the bake overdrive keep working.
      // Registered BEFORE litMaterials.add so gi/PCSS chain on top of it.
      vm.onBeforeCompile = (shader) => {
        shader.uniforms.uVidExposure = tvVidExposure;
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            uniform float uVidExposure;
            float tvAcesInv1(float y) {
              y = clamp(y, 0.0, 0.999);
              float a = 2.43 * y - 2.51;
              float b = 0.59 * y - 0.03;
              float disc = max(b * b - 4.0 * a * (0.14 * y), 0.0);
              return (-b - sqrt(disc)) / (2.0 * a);
            }
            vec3 tvAcesInv(vec3 y) {
              return vec3(tvAcesInv1(y.r), tvAcesInv1(y.g), tvAcesInv1(y.b));
            }`)
          .replace('#include <emissivemap_fragment>', `
            #ifdef USE_EMISSIVEMAP
              vec4 emissiveColor = texture2D( emissiveMap, vEmissiveMapUv );
              // totalEmissiveRadiance arrives as emissive x intensity (white
              // x glow); dividing by the base glow makes it a pure hover/bake
              // multiplier around the exact-colour value.
              totalEmissiveRadiance = ( totalEmissiveRadiance / ${TV_VIDEO_GLOW.toFixed(4)} )
                * tvAcesInv( emissiveColor.rgb ) / max( uVidExposure, 1e-4 );
            #endif`);
      };
      vm.customProgramCacheKey = () => 'tv-video-acesinv';
      mesh.material = vm;
      litMaterials.add(vm);
      // In screenMats so the GI bake overdrives it with the others. Note the
      // bake's restore sets every screen back to TV_GLOW — a dialled
      // ?tvvidglow= drifts after an in-session re-bake; reload to reassert.
      screenMats.add(vm);
    }

    // ── click-a-telly (hover + fly-to) ──────────────────────────────────────
    // One unit per screen: the screen mesh's PARENT GROUP is the telly (that
    // rule also catches the old computer's monitor — it has a Screen_Glow
    // too, and it being clickable is a feature). Hover indication is the
    // screen WAKING UP (emissive eased toward 1.7x) plus a pointer cursor —
    // cheaper and more in-world than an outline pass, and it reads instantly
    // because the screens are the brightest things in the room.
    function initTVFocus(propsRoot) {
      const units = [];
      const byMesh = new Map();
      propsRoot.traverse((o) => {
        if (!o.isMesh || !o.material) return;
        const list = Array.isArray(o.material) ? o.material : [o.material];
        if (!list.some((m) => m && m.name === 'Screen_Glow')) return;
        const root = o.parent && o.parent !== propsRoot ? o.parent : o;
        if (units.some((u) => u.root === root)) return;
        const meshes = [];
        root.traverse((c) => { if (c.isMesh) meshes.push(c); });
        const unit = { root, screen: o, meshes, mats: [] };
        units.push(unit);
        for (const c of meshes) byMesh.set(c, unit);
      });
      if (!units.length) return null;

      // ★ EACH TELLY GETS ITS OWN SCREEN MATERIAL. The glb shares Screen_Glow
      // instances between some sets, so brightening one screen lit its twins
      // too ("give each tv its own hover"). Split shared instances here —
      // BEFORE the gi/PCSS patch pass runs, because Material.clone() drops
      // onBeforeCompile, so a clone made later would silently lose both.
      {
        const claimed = new Set();
        for (const u of units) {
          for (const c of u.meshes) {
            const ms = Array.isArray(c.material) ? c.material : [c.material];
            ms.forEach((m, i) => {
              if (!m || m.name !== 'Screen_Glow') return;
              if (claimed.has(m)) {
                m = m.clone();
                if (Array.isArray(c.material)) c.material[i] = m; else c.material = m;
                litMaterials.add(m);
                screenMats.add(m);
              }
              claimed.add(m);
              u.mats.push(m);
            });
          }
        }
      }

      const allMeshes = [...byMesh.keys()];
      const ray = new THREE.Raycaster();
      const ptr = new THREE.Vector2();
      let ptrDirty = false, inCanvas = false, hovered = null;

      renderer.domElement.addEventListener('pointermove', (e) => {
        ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        ptrDirty = true; inCanvas = true;
      });
      renderer.domElement.addEventListener('pointerleave', () => {
        inCanvas = false; setHover(null);
      });

      function setHover(unit) {
        if (unit === hovered) return;
        if (hovered) for (const m of hovered.mats) m.__glowT = m.__glowBase;
        hovered = unit;
        if (hovered) for (const m of hovered.mats) {
          if (m.__glowBase === undefined) m.__glowBase = m.emissiveIntensity;
          m.__glowT = m.__glowBase * 1.7;
        }
        renderer.domElement.style.cursor = hovered ? 'pointer' : '';
      }

      // Click = travel. Registered at WINDOW CAPTURE so it runs before the
      // feedback panel's select (same trick, and same reason, as the flycam's
      // right-button grab): a plain click on a telly flies; a SHIFT-click is
      // let through so reviewers can still pick one for a note. The 4 px
      // click-not-drag test matches the panel's own.
      let downAt = null;
      addEventListener('pointerdown', (e) => {
        downAt = (e.button === 0 && !e.shiftKey && e.target === renderer.domElement)
          ? { x: e.clientX, y: e.clientY } : null;
      }, true);
      addEventListener('pointerup', (e) => {
        if (!downAt || e.button !== 0) return;
        const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
        downAt = null;
        if (moved > 4) return;
        if (window.__fbk?.anyDragging?.()) return;
        const unit = pick(e.clientX, e.clientY);
        if (!unit || !window.__fbk) return;
        e.stopPropagation();     // the panel must not ALSO select it
        // ★ Swallowing the pointerup STRANDS OrbitControls mid-drag: it armed
        // a rotate on the pointerdown and now never hears the release, so the
        // camera stays glued to the bare mouse after the flight ("the mouse
        // is still bound to the camera"). A synthetic pointercancel is the
        // clean way out — the controls treat it as a release, and the
        // feedback panel (pointerup only) still never sees the click.
        renderer.domElement.dispatchEvent(
          new PointerEvent('pointercancel', { pointerId: e.pointerId }));
        // Toggle: zoomed → any telly click flies home (the camera is locked
        // facing one screen, so "the screen" and "any telly" are the same
        // thing in practice); otherwise fly to the one clicked.
        if (focused) unfocus(); else focus(unit);
      }, true);

      // While zoomed the camera is LOCKED — no orbit, no fly. A drag from the
      // locked pose would fight the framing and leave the toggle pointing at
      // nothing; the screen itself is the way back out.
      // ★ Lock the individual gates, NOT controls.enabled — flyTo() owns that
      // flag and sets it back to true unconditionally when the flight lands
      // (feedback.js), which un-locked the camera the moment the zoom arrived.
      let focused = null;
      let relockT = 0;
      // ★ In presentation mode the lock is PERMANENT. unfocus() calls this
      // with false when the return flight lands, so the OR is what stops a
      // single telly visit from handing a visitor the orbit and fly controls
      // for the rest of the session.
      function setCamLock(on) {
        const lock = on || PRESENT;
        if (controls) {
          controls.enableRotate = controls.enablePan = controls.enableZoom = !lock;
        }
        if (fly) fly.enabled = !lock;
      }
      function unfocus() {
        focused = null;
        if (homePose) window.__fbk.flyTo(homePose.pos, homePose.tgt, 900);
        // re-enable once the return flight lands — enabling mid-flight lets a
        // drag fight the flyTo (unless another focus grabbed the lock again)
        clearTimeout(relockT);
        relockT = setTimeout(() => { if (!focused) setCamLock(false); }, 950);
      }

      function pick(x, y) {
        ptr.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
        ray.setFromCamera(ptr, camera);
        const hit = ray.intersectObjects(allMeshes, false)[0];
        return hit ? byMesh.get(hit.object) : null;
      }

      // Stand in front of the SCREEN, looking at it: position from its world
      // centre, direction from its averaged world normal (flipped toward the
      // room if the winding disagrees), distance from its own size — measured
      // from the mesh every time, never typed (the rig rule).
      function focus(unit) {
        const box = new THREE.Box3().setFromObject(unit.screen);
        const center = box.getCenter(new THREE.Vector3());
        const nm = new THREE.Matrix3().getNormalMatrix(unit.screen.matrixWorld);
        const na = unit.screen.geometry.getAttribute('normal');
        const n = new THREE.Vector3(), v = new THREE.Vector3();
        for (let i = 0; i < na.count; i++) n.add(v.fromBufferAttribute(na, i).applyMatrix3(nm));
        n.normalize();
        if (n.dot(v.subVectors(camera.position, center)) < 0) n.negate();
        const size = box.getSize(new THREE.Vector3());
        const d = Math.max(0.45, Math.hypot(size.x, size.y, size.z) * 1.9);
        window.__fbk.flyTo(center.clone().addScaledVector(n, d), center, 900);
        focused = unit;
        clearTimeout(relockT);
        setCamLock(true);
      }

      function tick(dt) {
        // the bake overdrives the screens; easing mid-bake would fight it
        if (gi && gi.baking) return;
        if (ptrDirty && inCanvas) {          // at most one raycast per frame
          ptrDirty = false;
          ray.setFromCamera(ptr, camera);
          const hit = ray.intersectObjects(allMeshes, false)[0];
          setHover(hit ? byMesh.get(hit.object) : null);
        }
        for (const u of units) for (const m of u.mats) {
          if (m.__glowT === undefined) continue;
          m.emissiveIntensity += (m.__glowT - m.emissiveIntensity) * Math.min(1, dt * 12);
        }
      }
      return { tick, focus, units };
    }

    // Consumer dials layered over the calibrated pairs: `shade` scales BOTH AO
    // amounts about their fitted values, `flarex` scales the format's flare/streak
    // pair, `drift` is the slow camera sway. All three are panel dials + URL keys.
    const RT_SHADE  = parseFloat(q.get('shade')  ?? '0.38'); // walls (structure)
    const RT_SHADEF = parseFloat(q.get('shadef') ?? '1');   // up-facing (floor)
    const RT_SHADEP = parseFloat(q.get('shadep') ?? '1');   // props, whole objects
    const RT_FLAREX = parseFloat(q.get('flarex') ?? '1');
    // Drift defaults OFF: even the tamed sway read as "the camera offsets after
    // load" to the art director on a locked shot. It is an opt-in dial now.
    const RT_DRIFT  = parseFloat(q.get('drift')  ?? '0');
    // 1.0 m since 2026-08-19 (was 1.6): the wall-base glow band — GI painting
    // the bottom courses 3.5x brighter than the same wall a metre up — was the
    // GRID, not a leak. Validity and bias sweeps moved nothing (all probes
    // involved are legit indoor ones); the nearest probe to a wall base simply
    // sits in open floor soaking up floor bounce, and a 1.6 m grid smears that
    // across the whole junction. 14x9x14 = 1764 probes, ~35 s bake, ~56 KB.
    const GI_SPACING = parseFloat(q.get('gistep') ?? '1.0');
    const GI_BOUNCES = parseInt(q.get('gibounce') ?? '2', 10);
    const GI_CUBE    = parseInt(q.get('gicube') ?? '16', 10);
    const GI_FORCE   = q.get('gibake') === '1';

    // ── renderer ────────────────────────────────────────────────────────────
    // ★ install() splices the PCSS branch into three's shadow chunk and MUST run
    // before any lit material compiles. It was missing here (n031: "the soften
    // slider doesn't affect the shadows") — patch() happily set USE_PCSS defines
    // for a branch that did not exist, so the whole loop ran plain PCF and both
    // the dial and ?sunang= were dead from birth.
    PCSS.install();
    const renderer = new THREE.WebGLRenderer(); // AA is the composer's MSAA target
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // applied by looks' OutputPass
    renderer.toneMappingExposure = EXPOSURE;
    renderer.shadowMap.enabled = true;
    // PCSS reads packed DEPTH out of the map — PCF, never VSM (moments read as garbage).
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.appendChild(renderer.domElement);
    const MAX_ANISOTROPY = renderer.capabilities.getMaxAnisotropy();

    // Depth prepass target for the raymarched shafts — the march stops at real geometry.
    const dpr0 = renderer.getPixelRatio();
    const depthRT = new THREE.WebGLRenderTarget(innerWidth * dpr0, innerHeight * dpr0);
    depthRT.depthTexture = new THREE.DepthTexture(innerWidth * dpr0, innerHeight * dpr0);
    depthRT.depthTexture.type = THREE.UnsignedIntType;
    depthRT.texture.minFilter = THREE.NearestFilter;
    depthRT.texture.magFilter = THREE.NearestFilter;

    // Props-only depth, for the AO's third channel: prop meshes also live on
    // camera layer 1, and each frame this target gets a depth render of layer 1
    // alone. A pixel whose scene depth matches this depth IS a prop, which is
    // how the composite tells "prop standing in the room" from "the wall behind
    // it" — screen-space AO has no other way to know what an object is.
    const propsDepthRT = new THREE.WebGLRenderTarget(innerWidth * dpr0, innerHeight * dpr0);
    propsDepthRT.depthTexture = new THREE.DepthTexture(innerWidth * dpr0, innerHeight * dpr0);
    propsDepthRT.depthTexture.type = THREE.UnsignedIntType;
    propsDepthRT.texture.minFilter = THREE.NearestFilter;
    propsDepthRT.texture.magFilter = THREE.NearestFilter;

    // ── sky ─────────────────────────────────────────────────────────────────
    // Not decoration: the GI probes render the scene from inside the room, so this dome
    // is the source of all the daylight the bounce carries. Cooler and dimmer than the
    // factory's — the reference reads overcast-soft, not blue-sky-hard.
    const SKY_ZENITH  = 0x5d99d6;
    const SKY_HORIZON = 0xd6e6f5;
    const SKY_GROUND  = 0x6b6459;
    const SKY_GAIN    = parseFloat(q.get('sky') ?? '0.55');

    const scene = new THREE.Scene();
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        uZenith:  { value: new THREE.Color(SKY_ZENITH) },
        uHorizon: { value: new THREE.Color(SKY_HORIZON) },
        uGround:  { value: new THREE.Color(SKY_GROUND) },
        uGain:    { value: SKY_GAIN },
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 uZenith, uHorizon, uGround;
        uniform float uGain;
        varying vec3 vDir;
        void main() {
          float h = vDir.y;
          vec3 up   = mix(uHorizon, uZenith, pow(clamp(h, 0.0, 1.0), 0.45));
          vec3 down = mix(uHorizon, uGround, pow(clamp(-h, 0.0, 1.0), 0.5));
          gl_FragColor = vec4((h > 0.0 ? up : down) * uGain, 1.0);
        }`,
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 24), skyMat);
    sky.renderOrder = -1;
    sky.frustumCulled = false;
    scene.add(sky);

    // ── the rig ─────────────────────────────────────────────────────────────
    RectAreaLightUniformsLib.init();
    const rig = new THREE.Group();
    rig.name = 'RealtimeRig';
    scene.add(rig);

    const sun = new THREE.DirectionalLight(0xfff3e0, RT_SUN);
    sun.castShadow = true;
    // ★ 2048, NOT 4096 — the 4096 map was the frame-pacing bug at large windows
    // (2026-08-19). PCSS scatters 40 taps per pixel across the map, and at 4096
    // those reads thrash the texture cache: measured at 2560x1340, mean 17 ms
    // with a THIRD of frames spiking past 28 ms (p50 7 / p95 42 — pure jitter),
    // against a flat 7.0 ms / p95 7.1 / zero spikes at 2048. 1024 buys nothing
    // further (6.94). The penumbra is far wider than a 2048 texel (~1.7 cm
    // here), so the blur hides the resolution — that is what PCSS is for.
    sun.shadow.mapSize.set(
      parseInt(q.get('sunmap') ?? '2048', 10), parseInt(q.get('sunmap') ?? '2048', 10));
    // ★ bias lives in METRES and is converted where the depth range is known (aimSun) —
    // shadow.bias is normalised depth, so refitting the box silently rescales a raw number.
    const SHADOW_BIAS_M = parseFloat(q.get('shadowbias') ?? '0.0012');
    sun.shadow.normalBias = parseFloat(q.get('shadownormal') ?? '0.004');
    rig.add(sun, sun.target);

    // Rect lights fill the real roof apertures (measured from the glb, never typed).
    const MAX_SKYLIGHTS = 6;
    const skylights = [];
    for (let i = 0; i < MAX_SKYLIGHTS; i++) {
      const l = new THREE.RectAreaLight(0xcfe0f2, 0, 1, 1);
      l.visible = false;
      rig.add(l);
      skylights.push(l);
    }

    // Soft downward contact shadow the rect lights cannot cast. Off by default here —
    // the reference's shadowing is carried by GI + AO.
    const skyShadow = new THREE.DirectionalLight(0xcfe0f2, RT_SKYSHADOW);
    skyShadow.castShadow = RT_SKYSHADOW > 0;
    skyShadow.shadow.mapSize.set(2048, 2048);
    rig.add(skyShadow, skyShadow.target);

    // The uniform-ambient stand-in the GI volume replaces. The honest A/B, off by default.
    const bounce = new THREE.HemisphereLight(SKY_HORIZON, 0x6b5844, RT_BOUNCE);
    rig.add(bounce);

    // IBL from the scene's own sky — for specular (the rusted beams, the glass), not fill.
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const skyOnly = new THREE.Scene();
    skyOnly.add(new THREE.Mesh(sky.geometry, sky.material));
    // ★ fromScene defaults to far=100 and the dome radius is 400 — size the far plane
    // to the dome or the environment map renders empty and the dial multiplies zero.
    const envRT = pmrem.fromScene(skyOnly, 0.04, 0.1, 800);
    scene.environment = envRT.texture;
    scene.environmentIntensity = RT_ENVI;

    let gi = null;

    function setRigEnabled(on) {
      rig.visible = on;
      scene.environmentIntensity = on ? RT_ENVI : 0;
      if (gi) gi.setIntensity(on ? RT_GI : 0);
    }

    let camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 500);

    // AO — n8ao since 2026-08-19 (art director's find). Three attempts at GTAO
    // all failed the same way: broad radii read as soup, tight radii inked
    // halos onto the wall behind every silhouette, and the ring where the
    // effect ends was always visible ("it stops then gets light again").
    // n8ao's accurate falloff feathers to nothing, so the whole GTAO apparatus
    // went with it: the floor split (ao-floor.js — factory loops still use
    // it), the radius/thickness pairing, and the aofrad/aothick/aoamt params.
    // `shade` now scales n8ao's intensity about AO_INTENSITY; `aorad` is the
    // n8ao radius in metres. gammaCorrection stays FALSE — the pass sits
    // mid-chain on linear HDR and OutputPass owns the transfer function;
    // n8ao's default true washes the whole frame out.
    const AO_INTENSITY = 3.0;
    let aoPass = null;
    let beautyRT = null;   // the MSAA scene target n8ao composites from
    let renderScale = 1;   // adaptive AA supersample factor (see applyRenderScale)
    if (RT_AO) {
      try {
        aoPass = new N8AOPass(scene, camera, innerWidth, innerHeight);
        aoPass.configuration.aoRadius = parseFloat(q.get('aorad') ?? '1.2');
        // Falloff 4 (was 1.2): at 1.2 a desk slab 0.7 m over the floor pooled
        // hard-edged darkness across its whole footprint — an AO cast that read
        // as a fake shadow. Higher falloff fades distant occluders, so the
        // pool retreats to the contact points and cavities keep their depth.
        aoPass.configuration.distanceFalloff = parseFloat(q.get('aofall') ?? '4');
        aoPass.configuration.intensity = AO_INTENSITY * RT_SHADE;
        // Full-res: halfRes shows its upsample blocks as JAGGIES wherever a
        // bright edge meets a dark one — the TV screens against their bezels
        // were staircased ("the anti-aliasing disappeared"). MSAA was on the
        // whole time; the aliasing was the AO's, not the rasteriser's.
        aoPass.configuration.halfRes = false;
        aoPass.configuration.gammaCorrection = false;

        // ★ THE MARRIAGE: hardware MSAA + n8ao, via the README's own escape
        // hatch ("Using your own render target"). Left to itself the pass
        // renders the scene un-antialiased and no amount of SMAA at the end
        // recovers it ("AA much worse than before the N8AO pass"). Instead:
        // autoRenderBeauty off, and WE render the scene into its
        // beautyRenderTarget — built with 8x samples and a depth texture
        // (three resolves both on read). The frame loop does the render just
        // before the composer runs, inside the drift wrapper so the AO sees
        // the same drifted eye as everything else.
        {
          const pr2 = Math.min(devicePixelRatio, 2);
          const bw = Math.floor(innerWidth * pr2), bh = Math.floor(innerHeight * pr2);
          // 4x, not 8x (2026-08-19): at a 2560-wide window the 8x half-float
          // target's bandwidth was ~7 ms of steady frame cost and fed the
          // frame-pacing spikes alongside the 4096 shadow map. factory-rt
          // measured 4x as the step that fixes the edges; 8x was habit, not a
          // measured need. ?beautysamples= to A/B.
          const bt = new THREE.WebGLRenderTarget(bw, bh, {
            samples: parseInt(q.get('beautysamples') ?? '4', 10),
            type: THREE.HalfFloatType });
          bt.depthTexture = new THREE.DepthTexture(bw, bh, THREE.UnsignedIntType);
          bt.depthTexture.format = THREE.DepthFormat;
          aoPass.beautyRenderTarget.dispose();
          aoPass.beautyRenderTarget = bt;
          aoPass.configuration.autoRenderBeauty = false;
          beautyRT = bt;
        }
        // Its blue-noise dither is SCREEN-fixed; under camera drift that grinds
        // against the moving image. A wider denoise erases the structure.
        aoPass.configuration.denoiseSamples = 16;
        aoPass.configuration.denoiseRadius = 12;

        // ── floor / wall split ──────────────────────────────────────────────
        // n8ao has ONE intensity, so the split patches its composite shader —
        // pinned-version territory like pcss.js: exact-string match against
        // n8ao@1.9.4, THROW on a miss, because a split that silently misses is
        // indistinguishable from a dial you have not found yet. The composite
        // reconstructs a NORMAL from depth right there, but its getWorldPos
        // only inverts the projection — the result is VIEW-space despite the
        // name, so up-ness needs the viewMatrixInv rotate (already a uniform).
        // intensity is an EXPONENT here (pow(ao, intensity)); the patch mixes
        // between the wall exponent and an independent floor exponent by
        // world up-ness, feathered over the same 0.70–0.92 band ao-floor used
        // so a ramp never draws a line across itself.
        const splitMat = aoPass.effectCompositerQuad._mesh.material;
        const NEEDLE = 'float finalAo = pow(texel.r, intensity);';
        if (!splitMat.fragmentShader.includes(NEEDLE)) {
          throw new Error('n8ao floor split: composite shader mismatch — version moved, re-pin');
        }
        // Three channels: walls (intensity), up-facing (uFloorInt), and PROPS
        // (uPropInt) — a prop pixel is one whose scene depth matches the
        // props-only depth prepass. Props win over the up-ness mix, so a crate
        // lid answers to the prop dial, not the floor dial. The suggestion and
        // the reason are the art director's (2026-08-19): one dial for walls
        // and props meant grounding the wall junction always muddied the set
        // dressing.
        splitMat.fragmentShader = splitMat.fragmentShader
          .replace('uniform float intensity;',
                   'uniform float intensity;\n    uniform float uFloorInt;\n    uniform float uPropInt;\n    uniform sampler2D uPropsDepth;')
          .replace(NEEDLE,
            `vec3 splitN = computeNormal(getWorldPos(depth, vUv), vUv);
        float splitUp = smoothstep(0.70, 0.92, (viewMatrixInv * vec4(splitN, 0.0)).y);
        float propD = texture2D(uPropsDepth, vUv).x;
        // Compare LINEARISED, in metres. Raw depth is non-linear: a 5e-4 raw
        // epsilon is half a metre at 5 m out, which classified the floor IN
        // FRONT of a prop (prop visible just behind it along the ray) as prop
        // — the reported hard AO cast hugging the desk. 2 cm is a real match.
        float isProp = (propD < 1.0 && abs(linearize_depth(depth, near, far) - linearize_depth(propD, near, far)) < 0.02) ? 1.0 : 0.0;
        float splitEx = mix(mix(intensity, uFloorInt, splitUp), uPropInt, isProp);
        float finalAo = pow(texel.r, splitEx);`);
        splitMat.uniforms.uFloorInt = { value: AO_INTENSITY * RT_SHADEF };
        splitMat.uniforms.uPropInt = { value: AO_INTENSITY * RT_SHADEP };
        splitMat.uniforms.uPropsDepth = { value: propsDepthRT.depthTexture };
        splitMat.needsUpdate = true;
      } catch (e) { console.warn('n8ao unavailable:', e); aoPass = null; }
    }

    // Raymarched shafts. The reference has NO god-rays, so the default density is a
    // whisper — enough that the air over the pool reads as air, not beams.
    // ?volmode=off still works from the URL; the panel row is gone — the Light rays
    // dial reaching zero says the same thing, and at zero the pass (and its whole
    // depth prepass) is actually switched off rather than marching an empty volume.
    let volMode = q.get('volmode') ?? 'ray';
    const volPass = new VolumetricLightPass({
      depthTexture: depthRT.depthTexture,
      getCamera: () => camera,
      steps: parseInt(q.get('volsteps') ?? '48', 10),
      color: 0xfff0d8,
    });
    volPass.uniforms.uDensity.value = parseFloat(q.get('voldens') ?? '0.012');
    volPass.uniforms.uG.value = parseFloat(q.get('volg') ?? '0.72');
    let volsVisible = q.get('vol') !== '0';
    let rayOn = volPass.uniforms.uDensity.value > 0.0004;
    const syncVol = () => { volPass.enabled = volsVisible && volMode === 'ray' && rayOn; };
    syncVol();
    const volProxy = {
      get visible() { return volsVisible; },
      set visible(on) { volsVisible = !!on; syncVol(); },
    };

    // ── lens ────────────────────────────────────────────────────────────────
    // Camera formats: focal length in real millimetres plus the lens character
    // (distortion, fringe, vignette, grain, letterbox) as one shader pass.
    // `lensHFov` overrides the Blender camera's fov; null = native. Default is
    // the 24 mm preset — the native 19 mm-equivalent read too tight for the room.
    let lensHFov = null;
    const lens = createLens({
      setHFov: (hf) => { lensHFov = hf; applyFov(); },
    });
    lens.setAspect(innerWidth / innerHeight);

    // One "Lens flare" dial scales the FORMAT's flare/streak pair rather than setting
    // absolute numbers — a Doc 16mm stays streak-free and an Anamorphic stays streaky,
    // whatever the dial says. Re-applied on every format change or the preset wins.
    let formatId = q.get('format') ?? 'wide24';
    let flareMul = RT_FLAREX;
    function applyFlare() {
      const p = lens.formats.find((f) => f.id === formatId) || lens.formats[0];
      lens.setFlare((p.flare ?? 0) * flareMul);
      lens.setStreak((p.streak ?? 0) * flareMul);
    }
    // Apply the format BEFORE the panel exists: the preset writes vignette/grain/flare
    // uniforms, so applying it after createLooks would clobber any values a shared
    // settings URL just replayed through the dials.
    lens.apply(formatId);
    applyFlare();

    // Slow camera sway for the endless loop. Applied pre-render, restored post-render,
    // so OrbitControls and the flycam never see it (see tools/driftcam.js).
    const drift = createDriftCam({ getCamera: () => camera, amount: RT_DRIFT });
    window.__drift = drift;

    // Depth of field. Off until the aperture dial moves — it costs a depth
    // prepass of its own. Focus follows the orbit target every frame, so the
    // thing you are looking at is the thing in focus.
    const bokehPass = new BokehPass(scene, camera, {
      focus: 6, aperture: 0, maxblur: 0.012,
    });
    bokehPass.enabled = false;

    // ── measuring the building ──────────────────────────────────────────────
    // /glas/ not /glass/ — the prop packs name their glass in Dutch ('nyclock -
    // glas', n026), and the shorter stem matches both languages.
    const GLASS_RE  = /glas/i;
    // Glass and decals must not cast — panes acting as lids is what "the lighting is
    // broken" actually looks like, and a dirt decal stops the light the glass let in.
    const NOCAST_RE = /glas|decal/i;

    // A pane's OWN plane, not its bounding box — a pitched sheet's box lies about
    // position, size and aim all at once (this was n017 in the proof of concept).
    function planeOf(mesh, centre) {
      const nrm = mesh.geometry.attributes.normal;
      const n = new THREE.Vector3(), t = new THREE.Vector3();
      for (let i = 0; i < nrm.count; i++) n.add(t.fromBufferAttribute(nrm, i));
      n.applyMatrix3(new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld));
      if (n.lengthSq() < 1e-8) n.set(0, -1, 0);
      n.normalize();
      if (n.y > 0) n.negate();          // a roof light faces the room
      const up = Math.abs(n.y) > 0.999 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(up, n).normalize();
      const v = new THREE.Vector3().crossVectors(n, u).normalize();
      const pos = mesh.geometry.attributes.position, p = new THREE.Vector3();
      let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
      for (let i = 0; i < pos.count; i++) {
        p.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld).sub(centre);
        uMin = Math.min(uMin, p.dot(u)); uMax = Math.max(uMax, p.dot(u));
        vMin = Math.min(vMin, p.dot(v)); vMax = Math.max(vMax, p.dot(v));
      }
      return { normal: n, uSize: uMax - uMin, vSize: vMax - vMin };
    }

    function measureApertures(root, box) {
      const panes = [];
      root.traverse((o) => {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        // Object name too — a roof light textured with a dirt decal has no glass
        // material at all, and missing it leaves that bay unlit.
        const isPane = mats.some((m) => GLASS_RE.test(m?.name || '')) || /WindowPanel/i.test(o.name);
        if (!isPane) return;
        const b = new THREE.Box3().setFromObject(o);
        const centre = b.getCenter(new THREE.Vector3());
        panes.push({ box: b, centre, plane: planeOf(o, centre) });
      });
      // Roof vs wall by HEIGHT — this roof is pitched, so "flat panes are thin in Y"
      // finds nothing. Wall windows feed the room through the GI volume instead.
      const yCut = box.min.y + (box.max.y - box.min.y) * 0.55;
      const roof = panes.filter((p) => p.centre.y > yCut);
      return { panes, roof };
    }

    let buildingBox = null;
    let apertures = { panes: [], roof: [] };

    function sunDirection(azDeg, elDeg) {
      const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
      return new THREE.Vector3(
        -Math.cos(el) * Math.sin(az), -Math.sin(el), -Math.cos(el) * Math.cos(az)).normalize();
    }
    let sunAz = RT_SUN_AZ, sunEl = RT_SUN_EL;

    function aimSun() {
      if (!buildingBox) return;
      const dir = sunDirection(sunAz, sunEl);
      const c = buildingBox.getCenter(new THREE.Vector3());
      const r = buildingBox.getSize(new THREE.Vector3()).length() / 2;
      sun.position.copy(c).addScaledVector(dir, -r * 1.5);
      sun.target.position.copy(c);
      const cam = sun.shadow.camera;
      cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
      cam.near = 0.1; cam.far = r * 3;
      sun.shadow.bias = -SHADOW_BIAS_M / (cam.far - cam.near);
      cam.updateProjectionMatrix();
      // PCSS turns depth gaps into metres via the frustum box — refit the box,
      // retell the shader, or the penumbra maths is silently wrong.
      PCSS.configureFromLight(sun);
    }
    function setSunAngles(az, el) {
      if (az !== null) sunAz = az;
      if (el !== null) sunEl = el;
      aimSun();
    }
    function aimSkyShadow() {
      if (!buildingBox) return;
      const c = buildingBox.getCenter(new THREE.Vector3());
      const r = buildingBox.getSize(new THREE.Vector3()).length() / 2;
      skyShadow.position.copy(c).add(new THREE.Vector3(0.6, r * 1.5, 0.4));
      skyShadow.target.position.copy(c);
      const cam = skyShadow.shadow.camera;
      cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
      cam.near = 0.1; cam.far = r * 3;
      skyShadow.shadow.bias = -SHADOW_BIAS_M / (cam.far - cam.near);
      skyShadow.shadow.normalBias = sun.shadow.normalBias;
      cam.updateProjectionMatrix();
    }

    // ── looks panel ─────────────────────────────────────────────────────────
    // The panel is consumer-facing since 2026-08-18: five groups, art dials only.
    // Everything that left it was rig CALIBRATION, not art direction — sun angles and
    // size (they invalidate the GI bake and the whole grade), skylight shadow, the AO
    // radii, GI bias / in-room threshold, sky IBL, fringe / distortion (the Lens
    // presets own those). Every one still answers to its URL param at boot, so a
    // calibration session is a link away — the panel just stops offering reviewers
    // dials that break the rig.
    const looks = createLooks({
      renderer, scene, getCamera: () => camera,
      initial: q.get('look') || 'original',
      menu: q.get('looks') !== '0',
      // ★ n8ao FIRST — it REPLACES the render (the pass draws the scene itself;
      // README: 'N8AOPass replaces RenderPass'). It sat mid-chain after the
      // shafts at first, which threw away both the MSAA'd render AND the
      // composited shafts, and read as 'I don't see any AA'. The RenderPass is
      // disabled below when the AO owns the frame.
      extraPasses: [...(aoPass ? [aoPass] : []), volPass, bokehPass, lens.flarePass, lens.pass],
      // SMAA at the very end, on the tone-mapped image — n8ao's own scene
      // render bypasses hardware MSAA entirely, so with AO on, edge smoothing
      // has to be post (the n8ao README is explicit about exactly this).
      finalPasses: [new SMAAPass(innerWidth, innerHeight)],
      // MSAA only matters when the AO is OFF (then the RenderPass draws the
      // frame and hardware AA works); with n8ao on it is pure wasted bandwidth.
      msaa: parseInt(q.get('msaa') ?? (RT_AO ? '0' : '8'), 10),
      volumetrics: [volProxy],
      volumetricsOn: q.get('vol') !== '0',
      tone: false,   // ACES is the show; ?tone= still works for A/Bs
      exposure: { group: 'light', label: 'Brightness' },
      groups: [
        { id: 'style',  label: 'Style',      icon: 'style' },
        { id: 'light',  label: 'Light',      icon: 'light' },
        { id: 'air',    label: 'Atmosphere', icon: 'atmosphere' },
        { id: 'camera', label: 'Camera',     icon: 'camera' },
        { id: 'finish', label: 'Finish',     icon: 'finish' },
      ],
      dials: [
        // ── Light ──
        { id: 'sun', label: 'Sunlight', group: 'light', min: 0, max: 8, curve: 1.6, value: RT_SUN,
          onInput: (v) => { sun.intensity = v; } },
        // PCSS penumbra — the apparent size of the sun. Back on the panel by
        // request (2026-08-19): softening the pool on the floor is art
        // direction, not calibration. Same id as the old URL key.
        { id: 'sunang', label: 'Sun softness', group: 'light', min: 0.002, max: 0.16, curve: 1.8,
          value: RT_SUNANG, onInput: (v) => PCSS.setSunAngle(v) },
        { id: 'skyl', label: 'Skylight', group: 'light', min: 0, max: 8, curve: 1.6, value: RT_SKYL,
          onInput: (v) => { for (const l of skylights) if (l.visible) l.intensity = v; } },
        { id: 'gi', label: 'Bounce light', group: 'light', min: 0, max: 4, curve: 1.4, value: RT_GI,
          onInput: (v) => { if (gi && rig.visible) gi.setIntensity(v); } },
        // Walls-only share of the bounce (per-material giGain) — the volume
        // over-lights big flat walls against the path-traced reference, and the
        // lift reads as sheen. 1.0 = same as everything else.
        { id: 'giwall', label: 'Bounce walls', group: 'light', min: 0, max: 1.5, value: RT_GIWALL,
          onInput: (v) => { for (const g of wallGiGains) g.value = v; } },
        // ONE dial for the AO pair — scales the wall and floor amounts together about
        // their fitted values. The radii are calibration and stay on URL params.
        // The AO split: walls-and-props vs up-facing surfaces (floor, table
        // tops — "floor" is a world normal, not a list of objects).
        { id: 'shade', label: 'Contact walls', group: 'light', min: 0, max: 2, value: RT_SHADE,
          onInput: (v) => {
            if (aoPass) aoPass.configuration.intensity = AO_INTENSITY * v;
          } },
        { id: 'shadef', label: 'Contact floor', group: 'light', min: 0, max: 2, value: RT_SHADEF,
          onInput: (v) => {
            if (aoPass) aoPass.effectCompositerQuad._mesh.material.uniforms.uFloorInt.value = AO_INTENSITY * v;
          } },
        { id: 'shadep', label: 'Contact props', group: 'light', min: 0, max: 2, value: RT_SHADEP,
          onInput: (v) => {
            if (aoPass) aoPass.effectCompositerQuad._mesh.material.uniforms.uPropInt.value = AO_INTENSITY * v;
          } },
        // ── Atmosphere ──
        { id: 'voldens', label: 'Light rays', group: 'air', volTied: true,
          min: 0, max: 0.4, curve: 2.2, value: volPass.uniforms.uDensity.value,
          onInput: (v) => { volPass.uniforms.uDensity.value = v; rayOn = v > 0.0004; syncVol(); } },
        // ── Camera ──
        { id: 'mm', label: 'Focal length', group: 'camera', min: 12, max: 100, curve: 1.8, value: 24,
          onInput: (v) => lens.setFocal(v) },
        // three's BokehPass aperture works in tiny units; 0 disables the pass
        { id: 'dof', label: 'Focus blur', group: 'camera', min: 0, max: 0.0004, curve: 2.0, value: 0,
          onInput: (v) => {
            bokehPass.enabled = v > 0.000004;
            bokehPass.uniforms.aperture.value = v;
          } },
        { id: 'drift', label: 'Drift', group: 'camera', min: 0, max: 1, value: RT_DRIFT,
          onInput: (v) => drift.setAmount(v) },
        // ── Finish ──
        { id: 'vig', label: 'Vignette', group: 'finish', min: 0, max: 0.6, value: 0.22,
          onInput: (v) => { lens.pass.uniforms.uVignette.value = v; } },
        { id: 'grain', label: 'Film grain', group: 'finish', min: 0, max: 0.15, curve: 1.6, value: 0.035,
          onInput: (v) => { lens.pass.uniforms.uGrain.value = v; } },
        { id: 'flarex', label: 'Lens flare', group: 'finish', min: 0, max: 2, value: RT_FLAREX,
          onInput: (v) => { flareMul = v; applyFlare(); } },
      ],
      choices: [
        { id: 'format', label: 'Lens', group: 'camera', value: formatId,
          options: lens.formats.map((f) => ({ label: f.label, value: f.id })),
          onChange: (v) => { formatId = v; lens.apply(v); applyFlare(); } },
      ],
    });
    window.__lens = lens;   // scripted checks — flare thresholds cannot be eyeballed
    window.__looks = looks;
    // n8ao owns the frame: the RenderPass would draw the whole scene a second
    // time only to be overwritten. Off when the AO is on.
    if (aoPass) looks.renderPass.enabled = false;
    camera.position.set(-10, 1.5, 4);

    let controls = null, fly = null;
    const state = { meshes: 0, tris: 0, noCast: 0, cam: 'default', gi: 'off' };

    // Preserve the Blender camera's HORIZONTAL fov across canvas shapes.
    let hFov = null;
    function applyFov() {
      camera.aspect = innerWidth / innerHeight;
      const hf = lensHFov ?? hFov;   // lens preset wins; null falls back to the Blender cam
      if (hf) {
        camera.fov = THREE.MathUtils.radToDeg(
          2 * Math.atan(Math.tan(hf / 2) / camera.aspect));
      }
      camera.updateProjectionMatrix();
    }

    // ── load ────────────────────────────────────────────────────────────────
    const hud = document.getElementById('hud');
    const bakeUI = document.getElementById('bake');
    const bakeTxt = document.getElementById('baketxt');
    const bakeBar = document.querySelector('#bakebar > i');
    const litMaterials = new Set();
    const wallGiGains = [];   // the wall materials' per-material GI gain uniforms

    // ── loading screen ────────────────────────────────────────────────────
    // One opaque cover from first paint until the room is COMPLETE — building,
    // props, GI — plus a few rendered frames, so shader compilation happens
    // behind it and the reveal is the finished image. The bar is honest but
    // coarse: 0-70% building download, then props, then lighting.
    const loadEl = document.getElementById('load');
    const loadUI = {
      txt: document.getElementById('loadtxt'),
      bar: document.querySelector('#loadbar > i'),
      set(text, frac) {
        if (text) this.txt.textContent = text;
        if (frac != null) this.bar.style.width = (100 * Math.min(1, frac)).toFixed(1) + '%';
      },
      fail(text) { this.txt.textContent = text; this.bar.style.background = '#e0604f'; },
      done() {
        // two frames through the real frame loop before the fade starts —
        // the first one pays any remaining shader compiles at full cover
        let n = 0;
        const tick = () => {
          if (++n < 3) { requestAnimationFrame(tick); return; }
          loadEl.style.opacity = '0';
          setTimeout(() => loadEl.remove(), 900);
        };
        requestAnimationFrame(tick);
      },
    };

    // Both glbs are Draco-compressed (gltf-transform draco, defaults: 14-bit
    // positions ≈ 2 mm over this room). The decoder wasm comes from the same
    // pinned CDN as three itself, so the versions cannot drift apart.
    const draco = new DRACOLoader()
      .setDecoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/gltf/');
    const gltfLoader = new GLTFLoader().setDRACOLoader(draco);

    gltfLoader.load('../../assets/dripping-pickle/structure.glb', async (gltf) => {
      let tris = 0, meshes = 0, noCast = 0;

      gltf.scene.traverse((o) => {
        if (o.isCamera) {
          camera = o;
          const vfov = THREE.MathUtils.degToRad(camera.fov);
          hFov = 2 * Math.atan(Math.tan(vfov / 2) * (camera.aspect || (16 / 9)));
          camera.near = 0.05; camera.far = 500;
          applyFov();
          state.cam = o.name;
          if (aoPass) aoPass.camera = camera; // extra passes hold their own reference
          bokehPass.camera = camera;          // same trap, same fix
        }
        if (!o.isMesh) return;
        meshes++;
        const idx = o.geometry.index;
        tris += (idx ? idx.count : o.geometry.attributes.position.count) / 3;

        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const blocks = mats.some((m) => m && NOCAST_RE.test(m.name || ''));
        o.castShadow = !blocks;
        o.receiveShadow = true;
        if (blocks) noCast++;

        for (const m of mats) {
          if (!m) continue;
          // Only real glass blends; anything else flagged transparent would sort
          // against itself and punch holes.
          if (m.transparent) {
            if (GLASS_RE.test(m.name || '')) {
              m.depthWrite = false;
              if (m.opacity === 1) m.opacity = 0.22;
            } else {
              m.transparent = false;
              m.depthWrite = true;
            }
          }
          if (/decal/i.test(m.name || '') && m.map) {
            m.transparent = true;
            m.depthWrite = false;
          }
          // The hero (mural) wall carries a BAKED AO map — ray-traced in
          // Blender with the props standing as occluders, on the dedicated
          // non-overlapping MuralUV layer (TEXCOORD_2 → channel 2). External
          // texture, so flipY must be false and the space linear; re-bake it
          // whenever the props against that wall move.
          if (m.name === 'M_Brick_Mural_60' && !m.aoMap) {
            const aoTex = new THREE.TextureLoader().load('../../assets/dripping-pickle/mural_ao.webp');
            aoTex.flipY = false;
            aoTex.colorSpace = THREE.NoColorSpace;
            aoTex.channel = 2;
            m.aoMap = aoTex;
            m.aoMapIntensity = parseFloat(q.get('muralao') ?? '1');
          }
          // Inside the room we face the back of every wall.
          m.side = THREE.DoubleSide;
          // ★ KEEP the roughness/metallic/normal maps — this export ships real ones.
          if (m.isMeshStandardMaterial) litMaterials.add(m);
          for (const tex of [m.map, m.normalMap, m.roughnessMap, m.metalnessMap,
                             m.aoMap, m.emissiveMap, m.alphaMap]) {
            if (tex) { tex.anisotropy = MAX_ANISOTROPY; tex.needsUpdate = true; }
          }
          m.needsUpdate = true;
        }
      });

      // Both glTF roots live under ONE group so the feedback panel can pick
      // props as well as the building (pickRoot below). Structure is child 0,
      // props child 1 — stored edits are keyed by node path, so the add order
      // is a contract, not a style choice.
      const pickables = new THREE.Group();
      pickables.name = 'Pickables';
      scene.add(pickables);
      pickables.add(gltf.scene);
      state.meshes = meshes; state.tris = tris; state.noCast = noCast;

      // camera arrives parented; free it so controls own it cleanly
      if (camera.parent && camera.parent !== scene) scene.attach(camera);

      // ── props ─────────────────────────────────────────────────────────────
      // Separate file so set dressing iterates without re-exporting the building.
      // Loaded BEFORE the GI bake: they occlude bounce and sit in it like the walls do.
      loadUI.set('setting the props…', 0.75);
      try {
        const props = await new Promise((res, rej) =>
          gltfLoader.load('../../assets/dripping-pickle/props.glb', res, undefined, rej));
        // One dressing pass, shared by props.glb and any increment glb below.
        const dressProp = (o) => {
          if (!o.isMesh) return;
          // Layer 1 marks "prop" for the AO's third channel — but rugs and
          // carpets lie flat ON the floor and read as floor, so they stay off
          // the layer and answer to the Contact floor dial instead (n030).
          if (!/carpet|rug/i.test(o.name)) o.layers.enable(1);
          o.castShadow = true;
          o.receiveShadow = true;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            if (!m) continue;
            // The TV screens — live antenna static (see the TV wall block up
            // top). One shared texture: the first screen builds it, the rest
            // point at it, so the whole wall costs one canvas + one upload.
            if (m.name === 'Screen_Glow' && !screenMats.has(m)) {
              if (m.emissiveMap && m.emissiveMap.image) {
                if (!tvStaticTex) tvStaticTex = makeTVStatic(m.emissiveMap);
                m.emissiveMap = tvStaticTex;
              }
              m.emissive.copy(TV_GREEN);
              m.emissiveIntensity = TV_GLOW;
              screenMats.add(m);
            }
            if (GLASS_RE.test(m.name || '')) {
              // Pack glass often loses its transmission on export and lands as
              // an OPAQUE metal-rough disc (the caged clock, n026 — it hid the
              // face and hands entirely). Rebuild it as the house glass.
              m.transparent = true;
              m.opacity = 0.18;
              m.depthWrite = false;
              m.roughness = 0.12;
              m.metalness = 0;
              o.castShadow = false;   // a glass pane acting as a lid, prop-sized
            } else if (m.transparent) {
              // carpet hair cards etc. — cut-outs, not blenders
              m.transparent = false;
              m.alphaTest = m.map ? 0.4 : 0;
              m.depthWrite = true;
            }
            if (m.isMeshStandardMaterial) litMaterials.add(m);
            for (const tex of [m.map, m.normalMap, m.roughnessMap, m.metalnessMap]) {
              if (tex) { tex.anisotropy = MAX_ANISOTROPY; tex.needsUpdate = true; }
            }
            m.needsUpdate = true;
          }
          // after the material pass, so the video clone inherits the finished setup
          if (TV_VIDEO && (TV_VIDEO_MESH === 'all'
              ? mats.some((m) => m && m.name === 'Screen_Glow')
              : o.name === TV_VIDEO_MESH)) playVideoOnScreen(o);
          state.meshes++;
        };
        props.scene.traverse(dressProp);
        pickables.add(props.scene);
        state.props = true;

        // Set-dressing INCREMENTS ship as their own small glbs — adding one
        // prop must never force a re-export of the 69 verified ones.
        // props_lamp.glb: the vintage floor lamp (chat 2026-08-19) — 90.7k
        // source tris budgeted to 17.6k by the diagonal rule, Draco'd to
        // 91 KB, no textures. The blend keeps the full-res mesh.
        let floorLampShade = null;
        try {
          const extra = await new Promise((res, rej) =>
            gltfLoader.load('../../assets/dripping-pickle/props_lamp.glb', res, undefined, rej));
          extra.scene.traverse(dressProp);
          extra.scene.traverse((c) => {
            if (floorLampShade || !c.isMesh) return;
            const ms = Array.isArray(c.material) ? c.material : [c.material];
            if (ms.some((m) => m && m.name === 'glas')) floorLampShade = c;
          });
          pickables.add(extra.scene);
        } catch (e) { console.warn('props_lamp.glb not loaded:', e); }

        if (TV_FOCUS) tvUX = initTVFocus(props.scene);

        // n039 + the floor lamp: a dim warm point light inside each lamp's
        // glass shade. Position is measured from the shade, never typed; the
        // shade gets a touch of warm emissive so the light has a visible
        // source. No shadow — a point shadow is six map renders, and at this
        // dimness the leak cannot read. Lives in the rig so the baked/RT
        // toggle takes it too. ?lamp= dials both, 0 removes them.
        const LAMP_INT = parseFloat(q.get('lamp') ?? '0.4');
        function lightLamp(shade) {
          if (!shade || LAMP_INT <= 0) return;
          const c = new THREE.Box3().setFromObject(shade).getCenter(new THREE.Vector3());
          const l = new THREE.PointLight(0xffc98a, LAMP_INT, 0, 2);
          l.position.copy(c);
          rig.add(l);
          const lm = Array.isArray(shade.material) ? shade.material[0] : shade.material;
          lm.emissive = new THREE.Color(0xffb066);
          lm.emissiveIntensity = 0.8;
        }
        lightLamp(props.scene.getObjectByName('Prop_Study_Table_Lamp_Metal001_1'));
        lightLamp(floorLampShade);

        // ── the cat (chat 2026-08-19): dozing on the carpet in the sun ─────
        // "Lie doze" is the sequencer's label for anim_lie_sleep (looping).
        // Every trap here is documented in CLAUDE.md's cat section: skinned
        // bounds don't follow bones (frustumCulled off), the ORM was stripped
        // so metalness must be zeroed or he renders chrome, and the fur ships
        // OUTSIDE the glb and needs flipY=false + sRGB or it loads mirrored
        // and pale. He is draggable in the panel on purpose — nothing drives
        // his transform here, so a reviewer nudging the nap spot is exactly
        // the kind of suggestion the panel exists for.
        // Spot measured live: the roof aperture's sun pool centres at
        // (-1.6, 0.9) and the persian carpet spans x -2.7..0.1 / z -1.5..0.5;
        // their overlap is the carpet's front-right strip.
        const CAT_ON   = q.get('cat') !== '0';
        const CAT_FUR  = q.get('catfur') ?? 'c6';
        if (CAT_ON) {
          try {
            // the nap cycle's three clips — sequencer labels "Lie doze" /
            // "Lie doze out" / "Lie doze in"
            const CAT_FILES = ['lie_sleep', 'lie_sleep_end', 'lie_sleep_start'];
            const [catG, ...catAnims] = await Promise.all([
              new Promise((res, rej) => gltfLoader.load('../../assets/cat/cat.glb', res, undefined, rej)),
              ...CAT_FILES.map((f) => new Promise((res, rej) =>
                gltfLoader.load(`../../assets/cat/anim_${f}.glb`, res, undefined, rej))),
            ]);
            const cat = catG.scene;
            let catMat = null;
            cat.traverse((o) => {
              if (!o.isMesh) return;
              o.castShadow = true;
              o.receiveShadow = true;
              o.frustumCulled = false;
              o.layers.enable(1);            // a prop, to the AO's third channel
              const m = o.material;
              if (o.isSkinnedMesh && !catMat) catMat = m;
              m.metalness = 0;
              if (m.isMeshStandardMaterial) litMaterials.add(m);
            });
            new THREE.TextureLoader().load(`../../assets/cat/fur/${CAT_FUR}.jpg`, (t) => {
              t.flipY = false;
              t.colorSpace = THREE.SRGBColorSpace;
              t.anisotropy = MAX_ANISOTROPY;
              if (catMat) { catMat.map?.dispose(); catMat.map = t; catMat.needsUpdate = true; }
            });
            // The nap spot was PLACED IN BLENDER: the art director parked a
            // pillow copy (Prop_Pillow.001, blender −0.379, −0.203, 0.007) on
            // the persian rug where he should lie, and these are that marker's
            // coordinates converted (blender x,y,z → three x,z,−y). The marker
            // stays in the blend, deliberately unexported. Still draggable in
            // the panel for fine tuning.
            cat.position.set(-0.379, 0.02, 0.203);
            cat.rotation.y = 3.8;
            pickables.add(cat);
            catMixer = new THREE.AnimationMixer(cat);
            // The nap cycle (art direction 2026-08-19): doze 20 s → doze out
            // → hold the awake lying pose 5 s → doze in → doze again, repeat.
            // The last two butt together with only the crossfade between.
            const [doze, dozeOut, dozeIn] = catAnims.map((g, i) => {
              const a = catMixer.clipAction(g.animations[0]);
              if (i > 0) { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
              return a;
            });
            const FADE = 0.35;
            const swap = (next, prev) => {
              next.reset(); next.crossFadeFrom(prev, FADE, false); next.play();
            };
            const dozeThenWake = () => setTimeout(() => swap(dozeOut, doze), 20000);
            doze.play();
            dozeThenWake();
            catMixer.addEventListener('finished', (e) => {
              if (e.action === dozeOut) setTimeout(() => swap(dozeIn, dozeOut), 5000);
              else if (e.action === dozeIn) { swap(doze, dozeIn); dozeThenWake(); }
            });
          } catch (e) { console.warn('cat not loaded:', e); }
        }
      } catch (e) { console.warn('props.glb not loaded:', e); }

      // ── measure, then aim ─────────────────────────────────────────────────
      buildingBox = new THREE.Box3().setFromObject(gltf.scene);
      apertures = measureApertures(gltf.scene, buildingBox);
      aimSun();
      aimSkyShadow();
      PCSS.setSunAngle(RT_SUNANG);

      apertures.roof.forEach((ap, i) => {
        const l = skylights[i];
        if (!l) return;
        l.visible = true;
        l.intensity = RT_SKYL;
        l.width = ap.plane.uSize; l.height = ap.plane.vSize;
        l.position.copy(ap.centre);
        l.lookAt(ap.centre.x + ap.plane.normal.x,
                 ap.centre.y + ap.plane.normal.y,
                 ap.centre.z + ap.plane.normal.z);
      });

      volPass.setLight(sun);
      volPass.uniforms.uMaxDist.value = buildingBox.getSize(new THREE.Vector3()).length();

      // ── GI ────────────────────────────────────────────────────────────────
      const giBounds = buildingBox.clone().expandByScalar(GI_SPACING * 0.5);
      gi = createGIVolume({
        renderer, scene, bounds: giBounds,
        spacing: GI_SPACING, cubeSize: GI_CUBE,
      });
      // "Walls" = the STRUCTURE that faces the whole room — n033–n037 widened
      // it from the masonry to the columns (M_Concrete_Columns + .001, which
      // despite the name is the ceilings), the Wood_60 boards, the two big
      // pitted-rust beams and the facade trim family. The floor and props
      // keep the full volume — the over-lighting is a big-flat-surface
      // problem, not a global one (see RT_GIWALL above).
      const WALL_GI_RE = new RegExp([
        'brick', 'mural', 'plaster',
        '^M_Concrete_Columns',              // columns AND the .001 ceilings
        '^Wood_60$',
        '^M_PittedRust_Beams$',
        '^modular_factory_facade_trim',     // the whole trim family, for consistency
      ].join('|'), 'i');
      for (const m of litMaterials) {
        gi.patch(m, { gain: WALL_GI_RE.test(m.name) ? RT_GIWALL : 1 });
        PCSS.patch(m);
        if (WALL_GI_RE.test(m.name)) wallGiGains.push(m.userData.giGain);
      }
      gi.setIntensity(0);              // dark until the volume holds something
      gi.setNormalBias(RT_GIBIAS);
      gi.setBackWeight(RT_GIVIS);
      gi.setValidThreshold(RT_GIVALID);

      // The shipped opening view — captured live by the art director with the fly
      // camera (2026-08-19), a step in and left of the Blender camera. The glb's
      // own camera still carries the Blender framing; these two constants override
      // it, and ?cam=&tgt= deep links override both (restoreView runs just below).
      // ★ Set target AFTER constructing OrbitControls, then update(): the ctor
      // lookAt()s its default target — the world origin — so any aim read before
      // the target is planted captures a yanked camera, not the framing.
      // Re-aimed live by the art director 2026-08-19 (the previous target's
      // z 0.707 had the whole view swung to the right).
      const HOME_POS = new THREE.Vector3(-4.968, 1.725, -0.048);
      const HOME_TGT = new THREE.Vector3(5.03, 1.568, -0.179);
      camera.position.copy(HOME_POS);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.copy(HOME_TGT);
      controls.update();
      fly = createFlyCam({ camera, controls });
      window.__fly = fly;
      if (PRESENT) {
        controls.enableRotate = controls.enablePan = controls.enableZoom = false;
        fly.enabled = false;
      }
      restoreView({ scene, camera, controls });

      homePose = { pos: HOME_POS, tgt: HOME_TGT };   // the TV toggle flies back here

      async function runBake() {
        bakeUI.style.display = 'block';
        // Overdrive the screens for the bake: a 0.3 m emitter is invisible to a
        // 1.6 m probe grid at display brightness. Restored in the finally.
        for (const m of screenMats) m.emissiveIntensity = TV_GLOW_BAKE;
        try {
        const r = await gi.bake({
          bounces: GI_BOUNCES,
          exclude: [],
          onProgress: ({ done, total, bounce, bounces }) => {
            bakeTxt.textContent = `baking light — bounce ${bounce}/${bounces}`;
            bakeBar.style.width = `${(100 * (bounce - 1 + done / total) / bounces).toFixed(1)}%`;
            loadUI.set(`baking light — bounce ${bounce}/${bounces}`,
